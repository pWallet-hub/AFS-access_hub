<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFS Command Center</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8; --panel: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #dcdfe4;
      --accent: #0b5cad; --accent-fg: #ffffff; --ok: #1e7e34; --bad: #b3261e; --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111214; --panel: #1b1d21; --fg: #f5f5f7; --muted: #a1a1a6; --line: #34373d;
        --accent: #4da3ff; --accent-fg: #061427; --ok: #5ed37b; --bad: #ff8a80; --warn: #f0c060;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111214; --panel: #1b1d21; --fg: #f5f5f7; --muted: #a1a1a6; --line: #34373d;
      --accent: #4da3ff; --accent-fg: #061427; --ok: #5ed37b; --bad: #ff8a80; --warn: #f0c060;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: var(--fg); background: var(--bg); }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 1.15rem; margin: 0; }
    header .who { color: var(--muted); font-size: .9rem; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
    nav button { background: none; border: 1px solid transparent; border-bottom: none; color: var(--muted); padding: 8px 12px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
    nav button[aria-selected="true"] { color: var(--fg); background: var(--panel); border-color: var(--line); }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    section.panel h2 { font-size: 1rem; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
    .card h3 { margin: 0; font-size: 1rem; }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; }
    .muted { color: var(--muted); }
    .tag { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
    label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 4px; }
    input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
    textarea { min-height: 60px; }
    button, .button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary, .button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    button.small { padding: 3px 8px; font-size: .82rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .toast { position: fixed; right: 16px; bottom: 16px; max-width: 360px; padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.15); }
    .toast.error { border-color: var(--bad); color: var(--bad); }
    .center { text-align: center; padding: 48px 16px; }
    .hidden { display: none !important; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 640px) { main { padding: 12px; } section.panel { padding: 12px; } }
  </style>
</head>
<body>
  <header>
    <h1>AFS Command Center</h1>
    <div class="who" id="who"></div>
  </header>

  <div id="signed-out" class="hidden center">
    <p>Sign in with your AFS account to see the applications assigned to you.</p>
    <a class="button primary" href="/auth/login">Sign in with AFS SSO</a>
  </div>

  <div id="signed-in" class="hidden">
    <nav role="tablist" id="tabs"></nav>
    <main id="views"></main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    const state = { me: null, tab: "apps" };
    const $ = (sel) => document.querySelector(sel);

    // Build DOM with textContent only, so no server value is ever parsed as HTML.
    function h(tag, attrs, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (value === null || value === undefined || value === false) continue;
        if (key === "class") node.className = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (key === "value") node.value = value;
        else node.setAttribute(key, value === true ? "" : value);
      }
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    function toast(message, isError) {
      const el = $("#toast");
      el.className = "toast" + (isError ? " error" : "");
      el.textContent = message;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.add("hidden"), 4000);
      el.classList.remove("hidden");
    }

    async function api(method, path, body) {
      const options = { method, credentials: "same-origin", headers: {} };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const res = await fetch(path, options);
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        if (res.status === 401 && path !== "/api/me") showSignedOut();
        const detail = data && data.detail;
        const message = Array.isArray(detail)
          ? detail.map((d) => (d.loc ? d.loc.slice(1).join(".") + ": " : "") + d.msg).join("; ")
          : detail || `Request failed (HTTP ${res.status})`;
        throw new Error(message);
      }
      return data;
    }

    function when(value) {
      return value ? new Date(value).toLocaleString() : "—";
    }

    function button(label, onClick, options = {}) {
      return h("button", { type: "button", class: "small" + (options.primary ? " primary" : ""), onclick: onClick, disabled: options.disabled }, label);
    }

    function table(headers, rows) {
      if (rows.length === 0) return h("p", { class: "muted" }, "Nothing to show yet.");
      return h("div", { class: "table-wrap" },
        h("table", null,
          h("thead", null, h("tr", null, headers.map((t) => h("th", null, t)))),
          h("tbody", null, rows.map((cells) => h("tr", null, cells.map((c) => h("td", null, c)))))
        ));
    }

    function panel(title, ...children) {
      return h("section", { class: "panel" }, h("h2", null, title), ...children);
    }

    function showSignedOut() {
      state.me = null;
      $("#who").textContent = "";
      $("#signed-in").classList.add("hidden");
      $("#signed-out").classList.remove("hidden");
    }

    // ---------- Tabs ----------

    const TABS = [
      { id: "apps", label: "My applications", roles: null, render: renderApps },
      { id: "users", label: "Employees", roles: ["super_admin", "access_admin"], render: renderUsers },
      { id: "applications", label: "Applications & roles", roles: ["super_admin", "access_admin"], render: renderApplications },
      { id: "assignments", label: "Assignments", roles: ["super_admin", "access_admin"], render: renderAssignments },
      { id: "integrations", label: "Integrations", roles: ["super_admin", "access_admin"], render: renderIntegrations },
      { id: "audit", label: "Audit log", roles: ["super_admin", "access_admin"], render: renderAudit },
    ];

    function visibleTabs() {
      return TABS.filter((t) => !t.roles || t.roles.includes(state.me.platform_role));
    }

    function renderTabs() {
      const nav = $("#tabs");
      nav.replaceChildren(...visibleTabs().map((t) =>
        h("button", { type: "button", role: "tab", "aria-selected": String(t.id === state.tab), onclick: () => selectTab(t.id) }, t.label)
      ));
    }

    function selectTab(id) {
      state.tab = id;
      renderTabs();
      const tab = TABS.find((t) => t.id === id);
      const views = $("#views");
      views.replaceChildren(h("p", { class: "muted" }, "Loading…"));
      tab.render(views).catch((err) => {
        views.replaceChildren(h("p", { class: "bad" }, err.message));
      });
    }

    // ---------- Employee portal ----------

    async function renderApps(root) {
      const apps = await api("GET", "/api/apps");
      root.replaceChildren(panel("Your applications",
        apps.length === 0
          ? h("p", { class: "muted" }, "No applications are assigned to you yet. Contact an access administrator if you need access.")
          : h("div", { class: "cards" }, apps.map((app) =>
              h("div", { class: "card" },
                h("h3", null, app.name),
                h("p", null, app.description),
                h("div", null,
                  app.role_name ? h("span", { class: "tag" }, "Role: " + app.role_name) : null,
                  " ",
                  app.available ? null : h("span", { class: "tag bad" }, "Unavailable")),
                app.available
                  ? h("a", { class: "button primary", href: app.launch_url, target: "_blank", rel: "noopener noreferrer" }, "Open application")
                  : h("p", { class: "muted" }, "This application is temporarily unavailable. Try again later or contact an administrator.")
              )))
      ));
    }

    // ---------- Employees ----------

    async function renderUsers(root) {
      const isSuper = state.me.platform_role === "super_admin";
      const users = await api("GET", "/api/admin/users");
      const emailInput = h("input", { type: "email", required: true, placeholder: "name@example.org", id: "new-email" });
      const nameInput = h("input", { type: "text", placeholder: "Optional", id: "new-name" });
      const createForm = h("form", { class: "inline", onsubmit: async (e) => {
        e.preventDefault();
        try {
          await api("POST", "/api/admin/users", { email: emailInput.value.trim(), display_name: nameInput.value.trim() || null });
          toast("Employee added. They can sign in with SSO, and assignments can be made now.");
          selectTab("users");
        } catch (err) { toast(err.message, true); }
      } },
        h("label", null, "Email", emailInput),
        h("label", null, "Display name", nameInput),
        h("button", { type: "submit", class: "primary" }, "Add employee"));

      const rows = users.map((u) => {
        const roleSelect = h("select", { disabled: !isSuper, onchange: async (e) => {
          try {
            await api("PATCH", `/api/admin/users/${u.id}`, { platform_role: e.target.value });
            toast(`Platform role updated for ${u.email}`);
            selectTab("users");
          } catch (err) { toast(err.message, true); selectTab("users"); }
        } },
          ["employee", "access_admin", "super_admin"].map((r) => h("option", { value: r, selected: r === u.platform_role }, r)));
        const toggle = button(u.status === "active" ? "Disable" : "Reactivate", async () => {
          try {
            await api("PATCH", `/api/admin/users/${u.id}`, { status: u.status === "active" ? "disabled" : "active" });
            toast(u.status === "active" ? "Account disabled" : "Account reactivated");
            selectTab("users");
          } catch (err) { toast(err.message, true); }
        });
        return [
          u.email,
          u.display_name || "—",
          u.linked ? h("span", { class: "ok" }, "Linked") : h("span", { class: "warn" }, "Awaiting first sign-in"),
          roleSelect,
          u.status === "active" ? h("span", { class: "ok" }, "Active") : h("span", { class: "bad" }, "Disabled"),
          when(u.last_login_at),
          toggle,
        ];
      });

      root.replaceChildren(
        panel("Add employee", createForm, h("p", { class: "muted" }, "Pre-provisioned accounts are linked to a central identity when that employee first signs in with a verified email address.")),
        panel("Employees", table(["Email", "Name", "Identity", "Platform role", "Status", "Last sign-in", ""], rows))
      );
    }

    // ---------- Applications and role mappings ----------

    async function renderApplications(root) {
      const isSuper = state.me.platform_role === "super_admin";
      const apps = await api("GET", "/api/admin/applications");

      const rows = apps.map((a) => [
        h("strong", null, a.name),
        h("code", null, a.slug),
        a.launch_url ? h("a", { href: a.launch_url, target: "_blank", rel: "noopener noreferrer" }, a.launch_url) : h("span", { class: "warn" }, "No launch URL"),
        a.enabled ? h("span", { class: "ok" }, "Enabled") : h("span", { class: "muted" }, "Disabled"),
        a.integration_type === "none" ? "Not integrated" : "OIDC",
        isSuper ? button(a.enabled ? "Disable" : "Enable", async () => {
          try {
            await api("PATCH", `/api/admin/applications/${a.id}`, { enabled: !a.enabled });
            toast(a.enabled ? "Application disabled" : "Application enabled");
            selectTab("applications");
          } catch (err) { toast(err.message, true); }
        }) : null,
      ]);

      const nameInput = h("input", { required: true, id: "app-name" });
      const slugInput = h("input", { required: true, pattern: "[a-z0-9][a-z0-9-]{1,40}", id: "app-slug", placeholder: "biocap-rwanda" });
      const urlInput = h("input", { type: "url", id: "app-url", placeholder: "https://…" });
      const descInput = h("textarea", { id: "app-desc" });
      const createApp = h("form", { class: "inline", onsubmit: async (e) => {
        e.preventDefault();
        try {
          await api("POST", "/api/admin/applications", {
            name: nameInput.value.trim(), slug: slugInput.value.trim(), description: descInput.value.trim(),
            launch_url: urlInput.value.trim() || null, enabled: false, integration_type: "none",
          });
          toast("Application registered (disabled until a launch URL is set and it is enabled)");
          selectTab("applications");
        } catch (err) { toast(err.message, true); }
      } },
        h("label", null, "Name", nameInput),
        h("label", null, "Slug", slugInput),
        h("label", null, "Launch URL", urlInput),
        h("label", null, "Description", descInput),
        h("button", { type: "submit", class: "primary" }, "Register application"));

      // Role mappings for one application at a time.
      const appSelect = h("select", { id: "role-app" }, apps.map((a) => h("option", { value: a.id }, a.name)));
      const roleBox = h("div", null);
      async function loadRoles() {
        const roles = await api("GET", `/api/admin/applications/${appSelect.value}/roles`);
        const roleName = h("input", { required: true, pattern: "[a-z0-9][a-z0-9_-]{0,39}", placeholder: "viewer" });
        const external = h("input", { required: true, placeholder: "Role name in the app" });
        const roleDesc = h("input", { placeholder: "Optional" });
        roleBox.replaceChildren(
          table(["Central role", "Role in application", "Description", ""], roles.map((r) => [
            h("code", null, r.name), r.external_role, r.description || "—",
            button("Delete", async () => {
              try { await api("DELETE", `/api/admin/roles/${r.id}`); toast("Role deleted"); loadRoles(); }
              catch (err) { toast(err.message, true); }
            }),
          ])),
          h("form", { class: "inline", onsubmit: async (e) => {
            e.preventDefault();
            try {
              await api("POST", `/api/admin/applications/${appSelect.value}/roles`, {
                name: roleName.value.trim(), external_role: external.value.trim(), description: roleDesc.value.trim(),
              });
              toast("Role mapping added");
              loadRoles();
            } catch (err) { toast(err.message, true); }
          } },
            h("label", null, "Central role", roleName),
            h("label", null, "Role in application", external),
            h("label", null, "Description", roleDesc),
            h("button", { type: "submit", class: "primary" }, "Add role mapping")));
      }
      appSelect.addEventListener("change", loadRoles);

      root.replaceChildren(
        ...[
          panel("Applications", table(["Name", "Slug", "Launch URL", "Status", "Integration", ""], rows)),
          isSuper ? panel("Register application", createApp) : null,
          panel("Application-specific roles", apps.length ? h("form", { class: "inline" }, h("label", null, "Application", appSelect)) : h("p", { class: "muted" }, "No applications registered."), roleBox),
        ].filter(Boolean));
      if (apps.length) loadRoles();
    }

    // ---------- Assignments ----------

    async function renderAssignments(root) {
      const [users, apps, assignments] = await Promise.all([
        api("GET", "/api/admin/users"),
        api("GET", "/api/admin/applications"),
        api("GET", "/api/admin/assignments"),
      ]);
      const activeUsers = users.filter((u) => u.status === "active");
      const enabledApps = apps.filter((a) => a.enabled);
      const userSelect = h("select", { id: "as-user" }, activeUsers.map((u) => h("option", { value: u.id }, u.email)));
      const appSelect = h("select", { id: "as-app" }, enabledApps.map((a) => h("option", { value: a.id }, a.name)));
      const roleSelect = h("select", { id: "as-role" });

      async function loadRolesFor() {
        const roles = await api("GET", `/api/admin/applications/${appSelect.value}/roles`);
        roleSelect.replaceChildren(
          h("option", { value: "" }, "Standard access (no specific role)"),
          ...roles.map((r) => h("option", { value: r.id }, `${r.name} → ${r.external_role}`)));
      }
      appSelect.addEventListener("change", loadRolesFor);

      const grant = h("form", { class: "inline", onsubmit: async (e) => {
        e.preventDefault();
        try {
          await api("POST", "/api/admin/assignments", {
            user_id: userSelect.value, application_id: appSelect.value, app_role_id: roleSelect.value || null,
          });
          toast("Access saved");
          selectTab("assignments");
        } catch (err) { toast(err.message, true); }
      } },
        h("label", null, "Employee", userSelect),
        h("label", null, "Application", appSelect),
        h("label", null, "Role", roleSelect),
        h("button", { type: "submit", class: "primary", disabled: !activeUsers.length || !enabledApps.length }, "Grant or update access"));

      const rows = assignments.map((s) => [
        s.email, s.application_name, s.role_name || "Standard access", when(s.granted_at),
        button("Revoke", async () => {
          if (!confirm(`Revoke ${s.application_name} access for ${s.email}?`)) return;
          try {
            await api("DELETE", `/api/admin/assignments/${s.id}`);
            toast("Access revoked");
            selectTab("assignments");
          } catch (err) { toast(err.message, true); }
        }),
      ]);

      root.replaceChildren(
        panel("Grant access", grant, h("p", { class: "muted" }, "Access takes effect on the employee's next request to Command Center. Applications re-check access themselves once integrated.")),
        panel("Current assignments", table(["Employee", "Application", "Role", "Granted", ""], rows))
      );
      if (enabledApps.length) loadRolesFor();
    }

    // ---------- Integrations ----------

    const STATUS_LABEL = { ok: ["ok", "Healthy"], error: ["bad", "Failing"], not_connected: ["muted", "Not connected yet"] };

    async function renderIntegrations(root) {
      const apps = await api("GET", "/api/admin/integrations");
      const rows = apps.map((a) => {
        const [cls, label] = STATUS_LABEL[a.status] || ["muted", a.status];
        return [
          h("strong", null, a.name),
          h("span", { class: cls }, label),
          a.last_access_ok_at ? when(a.last_access_ok_at) : "—",
          a.last_error ? h("span", { class: "bad" }, a.last_error) : "—",
          a.last_error_at ? when(a.last_error_at) : "—",
          button("Events", async () => {
            try {
              const events = await api("GET", `/api/admin/integrations/${a.id}/events?limit=50`);
              eventsBox.replaceChildren(
                panel(`Events: ${a.name}`, events.length
                  ? table(["When", "Kind", "Outcome", "Detail"], events.map((e) => [
                      when(e.occurred_at), e.kind,
                      e.outcome === "success" ? h("span", { class: "ok" }, "success") : h("span", { class: "bad" }, "failure"),
                      e.detail || "—",
                    ]))
                  : h("p", { class: "muted" }, "No events recorded.")));
            } catch (err) { toast(err.message, true); }
          }),
        ];
      });
      const eventsBox = h("div", null);
      root.replaceChildren(
        panel("Integration health",
          h("p", { class: "muted" }, "Each application's access checks and any failures it reports. A failing status means a failure was reported after the last successful check."),
          table(["Application", "Status", "Last successful check", "Last error", "Error time", ""], rows)),
        eventsBox);
    }

    // ---------- Audit ----------

    async function renderAudit(root) {
      const entries = await api("GET", "/api/admin/audit?limit=200");
      const rows = entries.map((e) => [
        when(e.occurred_at), e.actor_identity, e.action,
        e.target_type + (e.target_id ? " " + e.target_id.slice(0, 8) : ""),
        e.application_slug || "—",
        e.outcome === "success" ? h("span", { class: "ok" }, "success") : h("span", { class: "bad" }, "failure"),
        Object.keys(e.details || {}).length ? h("code", null, JSON.stringify(e.details)) : "—",
      ]);
      root.replaceChildren(panel("Recent activity", table(["When", "Actor", "Action", "Target", "Application", "Outcome", "Details"], rows)));
    }

    // ---------- Startup ----------

    async function start() {
      let me;
      try {
        me = await api("GET", "/api/me");
      } catch (err) {
        showSignedOut();
        return;
      }
      state.me = me;
      $("#who").textContent = `${me.name || me.email} · ${me.platform_role.replace("_", " ")} · `;
      const out = h("a", { href: "/auth/logout" }, "Sign out");
      $("#who").append(out);
      $("#signed-out").classList.add("hidden");
      $("#signed-in").classList.remove("hidden");
      renderTabs();
      selectTab("apps");
    }

    start();
  </script>
</body>
</html>
