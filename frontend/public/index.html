<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AFS Command Center: sign in once to reach the applications you are assigned.">
  <title>AFS Command Center</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f9fbfa; --surface: #ffffff; --surface-2: #f5f7f6; --surface-3: #e8edeb;
      --fg: #001e2b; --muted: #5c6c75; --line: #e8edeb; --line-strong: #c1c7c6;
      --accent: #00684a; --accent-hover: #00593f; --accent-fg: #ffffff; --accent-soft: #e3fcf7;
      --ok: #00684a; --ok-soft: #e3fcf7; --bad: #c42a2a; --bad-soft: #ffeae5; --warn: #944f01; --warn-soft: #fef7db;
      --top: #001e2b; --top-2: #112733; --top-fg: #f9fbfa; --top-muted: #a7b5bb; --top-line: #1c3a48; --spark: #00ed64;
      --focus: #016bf8; --shadow: 0 1px 2px rgba(0, 30, 43, .05), 0 1px 3px rgba(0, 30, 43, .07);
      --radius: 12px;
      /* Chart roles: validated categorical slots (light), recessive grid and axis ink. */
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
      --s-other: #b8c4c2; --s-neutral: #5c6c75; --grid: #e8edeb; --axis: #889397;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #00151f; --surface: #0b2531; --surface-2: #10303e; --surface-3: #1a3a48;
        --fg: #e8edeb; --muted: #a3b2b8; --line: #1d3b49; --line-strong: #3d4f58;
        --accent: #00ed64; --accent-hover: #71f6ba; --accent-fg: #001e2b; --accent-soft: #023430;
        --ok: #71f6ba; --ok-soft: #023430; --bad: #ff9f8f; --bad-soft: #3a1310; --warn: #ffc010; --warn-soft: #3a2a05;
        --top: #000f17; --top-2: #0b2531; --top-line: #1d3b49;
        --focus: #7cb7ff; --shadow: 0 1px 2px rgba(0, 0, 0, .45);
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
        --s-other: #5c6c75; --s-neutral: #a3b2b8; --grid: #1d3b49; --axis: #7b8c93;
      }
    }
    :root[data-theme="dark"] {
      --bg: #00151f; --surface: #0b2531; --surface-2: #10303e; --surface-3: #1a3a48;
      --fg: #e8edeb; --muted: #a3b2b8; --line: #1d3b49; --line-strong: #3d4f58;
      --accent: #00ed64; --accent-hover: #71f6ba; --accent-fg: #001e2b; --accent-soft: #023430;
      --ok: #71f6ba; --ok-soft: #023430; --bad: #ff9f8f; --bad-soft: #3a1310; --warn: #ffc010; --warn-soft: #3a2a05;
      --top: #000f17; --top-2: #0b2531; --top-line: #1d3b49;
      --focus: #7cb7ff; --shadow: 0 1px 2px rgba(0, 0, 0, .45);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --s-other: #5c6c75; --s-neutral: #a3b2b8; --grid: #1d3b49; --axis: #7b8c93;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font: 14.5px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); background: var(--bg); font-variant-numeric: tabular-nums;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    a { color: var(--accent); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: 12px; top: -60px; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; border-radius: 6px; z-index: 100; }
    .skip:focus { top: 12px; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
      height: 56px; padding: 0 16px; background: var(--top); color: var(--top-fg); border-bottom: 1px solid var(--top-line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; color: var(--top-fg); text-decoration: none; white-space: nowrap; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
      background: var(--spark); color: #001e2b; font-size: 15px; font-weight: 800;
    }
    .crumb { display: flex; align-items: center; gap: 8px; color: var(--top-muted); font-size: 13px; min-width: 0; }
    .crumb b { color: var(--top-fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb .sep { opacity: .5; }
    .topbar .spacer { flex: 1; }
    .topbar .btn, .topbar summary.btn { background: var(--top-2); border-color: var(--top-line); color: var(--top-fg); }
    .topbar .btn:hover, .topbar summary.btn:hover { background: var(--top-line); }
    .account { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .account-meta { text-align: right; min-width: 0; line-height: 1.25; }
    .account-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .account-role { font-size: 12px; color: var(--top-muted); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: var(--top-2); color: var(--spark); font-weight: 700; font-size: 12.5px; border: 1px solid var(--top-line);
    }
    .topbar .nav-toggle { display: none; }

    /* ---------- Menus (quick actions) ---------- */
    details.menu { position: relative; }
    details.menu > summary { list-style: none; }
    details.menu > summary::-webkit-details-marker { display: none; }
    .menu-list {
      position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; z-index: 40; padding: 6px;
      background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 30, 43, .22);
    }
    .menu-list .menu-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 4px; }
    .menu-list button, .menu-list a {
      display: flex; width: 100%; justify-content: flex-start; gap: 10px; border: 0; background: none; min-height: 34px;
      padding: 0 10px; border-radius: 6px; font-weight: 500; color: var(--fg); text-decoration: none; font-size: 14px;
    }
    .menu-list button:hover, .menu-list a:hover { background: var(--surface-2); }
    .menu-list svg { width: 16px; height: 16px; flex: none; color: var(--muted); align-self: center; }
    .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

    /* ---------- Layout and side navigation ---------- */
    .layout { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: calc(100vh - 56px); }
    nav.side {
      position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
      border-right: 1px solid var(--line); background: var(--surface); padding: 12px 10px 24px;
    }
    nav.side .group {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 10px 6px;
    }
    nav.side .group .count { font-weight: 600; letter-spacing: 0; background: var(--surface-2); border-radius: 999px; padding: 0 7px; }
    nav.side .nav-note { font-size: 13px; color: var(--muted); padding: 2px 10px 6px; margin: 0; }
    nav.side a, .nav-app-row {
      position: relative; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 6px;
      color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px;
    }
    nav.side a:hover, .nav-app-row:hover { background: var(--surface-2); }
    nav.side a[aria-current="page"], .nav-app-row.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    nav.side a[aria-current="page"]::before, .nav-app-row.current::before {
      content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
    }
    nav.side svg { width: 17px; height: 17px; flex: none; opacity: .85; }
    .nav-app-row { padding: 0 2px 0 10px; }
    .nav-app-row > a { flex: 1; min-width: 0; padding: 0; min-height: 34px; background: none !important; color: inherit; font-weight: inherit; }
    .nav-app-row > a::before { display: none; }
    .nav-app-row > a span.name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-app.disabled .name { color: var(--muted); }
    .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
    .health-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-left: auto; }
    .health-dot.ok { background: var(--ok); }
    .health-dot.error { background: var(--bad); }
    .health-dot.not_connected, .health-dot.off { background: var(--line-strong); }
    .chev {
      min-height: 28px; width: 28px; padding: 0; border: 0; background: none; color: var(--muted); border-radius: 6px; flex: none;
    }
    .chev:hover { background: var(--surface-3); }
    .chev svg { width: 14px; height: 14px; transition: transform .15s; }
    .chev[aria-expanded="true"] svg { transform: rotate(90deg); }
    .nav-sub { margin: 2px 0 6px 15px; padding-left: 10px; border-left: 1px solid var(--line); }
    nav.side .nav-sub a { min-height: 30px; font-size: 13px; color: var(--muted); font-weight: 500; }
    nav.side .nav-sub a:hover { color: var(--fg); }
    nav.side .nav-sub a[aria-current="page"] { color: var(--accent); background: none; font-weight: 600; }
    nav.side .nav-sub a[aria-current="page"]::before { left: -11px; top: 7px; bottom: 7px; }
    nav.side .nav-sub svg { width: 14px; height: 14px; }
    .ext { margin-left: auto; opacity: .7; }

    main { padding: 24px clamp(16px, 3vw, 36px) 64px; min-width: 0; max-width: 1480px; width: 100%; }
    main:focus { outline: none; } /* focused by script on each page change, not by the user */
    .page-head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
    .page-head h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; font-weight: 680; }
    .page-head p { margin: 0; color: var(--muted); max-width: 72ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
    .section-title h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .section-title p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

    /* ---------- Controls ---------- */
    button, .btn {
      font: inherit; font-weight: 550; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    button:hover, .btn:hover { background: var(--surface-2); }
    button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.primary:hover, .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.danger { color: var(--bad); }
    button.danger:hover { background: var(--bad-soft); border-color: var(--bad-soft); }
    button.small, .btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; font-weight: 600; font-size: 13px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn svg, button svg { width: 15px; height: 15px; flex: none; }
    input, select, textarea {
      font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong);
      border-radius: 8px; padding: 8px 10px; min-height: 36px; min-width: 0; width: 100%;
    }
    textarea { min-height: 76px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
    input[aria-invalid="true"] { border-color: var(--bad); }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { font-size: 13px; font-weight: 600; color: var(--fg); }
    .field .hint { font-size: 12px; color: var(--muted); }
    .field .error { font-size: 12px; color: var(--bad); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .toolbar .search { flex: 1 1 240px; max-width: 360px; }
    .toolbar select { width: auto; min-width: 150px; }
    .toolbar > input { width: auto; flex: 1 1 220px; max-width: 360px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

    /* ---------- Surfaces ---------- */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
    .panel + .panel { margin-top: 16px; }
    .cards > .panel, .kpis > .panel, .grid > .panel, .app-grid > .panel { margin-top: 0; }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; flex-wrap: wrap; }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
    .panel-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .panel-body { padding: 14px 18px 18px; }
    .panel-body.flush { padding: 10px 0 0; }
    .grid { display: grid; gap: 16px; margin-top: 16px; }
    .grid.two-one { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
    .grid.halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .table-wrap { overflow-x: auto; border-radius: var(--radius); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
    td .sub { display: block; font-size: 12px; color: var(--muted); }
    td.num, th.num { text-align: right; }
    td.actions-cell { text-align: right; white-space: nowrap; }
    td.actions-cell > * + * { margin-left: 6px; }
    td a.row-link { color: var(--fg); font-weight: 600; text-decoration: none; }
    td a.row-link:hover { color: var(--accent); text-decoration: underline; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap;
    }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.accent { background: var(--accent-soft); color: var(--accent); }
    .badge.neutral::before { display: none; }

    .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .15s, border-color .15s, transform .15s; }
    .card:hover { box-shadow: 0 6px 18px rgba(0, 30, 43, .10); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); transform: translateY(-1px); }
    .card .foot .btn { flex: none; }
    .card h3 { margin: 0; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card h3 a { color: var(--fg); text-decoration: none; }
    .card h3 a:hover { color: var(--accent); text-decoration: underline; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .card .meta { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    .card .meta b { color: var(--fg); font-weight: 600; }
    .card .foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .app-icon {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none;
      background: var(--accent-soft); color: var(--fg); font-weight: 700; font-size: 16px;
    }
    .app-icon.lg { width: 52px; height: 52px; font-size: 21px; border-radius: 12px; }
    .app-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .app-head .sub { font-size: 12px; color: var(--muted); }
    .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Application collection */
    .app-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    .app-tile { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .app-tile .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .app-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .app-stats dt { font-size: 11.5px; color: var(--muted); }
    .app-stats dd { margin: 0; font-size: 18px; font-weight: 650; }
    .app-tile .foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; flex-wrap: wrap; }
    .add-tile { border-style: dashed; box-shadow: none; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; min-height: 180px; }

    /* Stat tiles */
    .kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 4px; }
    .kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .kpi .label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .kpi .value { font-size: 28px; line-height: 1.15; font-weight: 650; margin-top: 2px; }
    .kpi .value small { font-size: 15px; color: var(--muted); font-weight: 500; }
    .kpi .sub { font-size: 12.5px; color: var(--muted); }
    .kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .delta { font-size: 12px; font-weight: 650; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    .delta.up { background: var(--ok-soft); color: var(--ok); }
    .delta.down { background: var(--bad-soft); color: var(--bad); }
    .delta.flat { background: var(--surface-2); color: var(--muted); }

    .hero { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
    .hero .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .hero h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; font-weight: 680; }
    .hero p { margin: 0; color: var(--muted); }

    .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
    .empty .icon { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
    .empty .icon svg { width: 22px; height: 22px; }
    .empty h3 { margin: 0 0 6px; color: var(--fg); font-size: 16px; }
    .empty p { margin: 0 auto 14px; max-width: 46ch; }
    .empty.small { padding: 22px 12px; }
    .notice { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; color: var(--muted); }
    .notice.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-soft); color: var(--bad); }
    .notice + .kpis, .notice + .grid { margin-top: 16px; }

    .skeleton { display: grid; gap: 10px; padding: 18px; }
    .skeleton span { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skeleton span { animation: none; } * { transition: none !important; } }

    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; color: var(--muted); font-size: 13px; }
    pre.details { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: 8px; max-width: 520px; }

    /* ---------- Charts ---------- */
    figure.viz { margin: 0; }
    .chart { position: relative; width: 100%; }
    .chart svg { display: block; overflow: visible; }
    .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
    .chart .base-line { stroke: var(--line-strong); stroke-width: 1; }
    .chart .tick { fill: var(--axis); font-size: 11px; }
    .chart .bar { pointer-events: none; }
    .chart .hit { fill: transparent; cursor: crosshair; }
    .chart .hit:hover { fill: var(--surface-2); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 10px; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .legend b { color: var(--fg); font-weight: 600; }
    .viz-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
    .viz-table { margin-top: 8px; max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    .viz-table th, .viz-table td { padding: 6px 10px; font-size: 12.5px; }
    .chart-tip {
      position: fixed; z-index: 60; pointer-events: none; min-width: 150px; max-width: 260px; padding: 8px 10px;
      background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 30, 43, .2); font-size: 12.5px;
    }
    .chart-tip .tip-title { font-weight: 650; margin-bottom: 4px; }
    .chart-tip .tip-row { display: flex; align-items: center; gap: 8px; }
    .chart-tip .tip-row b { margin-left: auto; padding-left: 12px; }
    .chart-tip .tip-row.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
    .spark { display: block; flex: none; }
    .kpi .spark { flex: 0 1 84px; min-width: 40px; width: 84px; }
    .kpi .value { flex: none; }

    /* Horizontal bars */
    .hbars { display: grid; gap: 10px; }
    .hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13.5px; }
    .hbar .hbar-label { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .hbar .hbar-label a, .hbar .hbar-label span.t { color: var(--fg); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hbar .hbar-label a:hover { color: var(--accent); text-decoration: underline; }
    .hbar .track { height: 14px; border-radius: 0 4px 4px 0; background: transparent; }
    .hbar .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--s-neutral); min-width: 2px; }
    .hbar .val { font-weight: 600; min-width: 2ch; text-align: right; }

    /* Segmented (part-to-whole) bar */
    .seg { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
    .seg span { display: block; height: 100%; min-width: 3px; }
    .seg-legend { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
    .seg-legend li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
    .seg-legend b { margin-left: auto; font-weight: 600; }
    .seg-legend .pct { color: var(--muted); font-size: 12px; min-width: 4ch; text-align: right; }
    .seg-block + .seg-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .seg-block h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }

    /* Activity feed */
    .feed { list-style: none; margin: 0; padding: 0; }
    .feed li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 18px; border-top: 1px solid var(--line); font-size: 13.5px; }
    .feed li:first-child { border-top: 0; }
    .feed .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); transform: translateY(-1px); }
    .feed .dot.failure { background: var(--bad); }
    .feed .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .feed .what b { font-weight: 600; }
    .feed .what .sub { color: var(--muted); }

    .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13.5px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

    /* ---------- Dialogs and toasts ---------- */
    dialog { border: none; padding: 0; border-radius: 14px; background: var(--surface); color: var(--fg); width: min(520px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    dialog::backdrop { background: rgba(0, 21, 31, .55); }
    dialog.wide { width: min(780px, calc(100vw - 32px)); }
    .dialog-head { padding: 18px 20px 0; }
    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-body { padding: 16px 20px; display: grid; gap: 14px; max-height: min(64vh, 620px); overflow: auto; }
    .dialog-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .dialog-foot .grow { flex: 1; }
    .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 10px; z-index: 70; width: min(380px, calc(100vw - 32px)); }
    .toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font-size: 14px; }
    .toast.error { border-left-color: var(--bad); }

    /* ---------- Sign-in ---------- */
    .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent), var(--bg); }
    .signin-card { width: min(420px, 100%); padding: 32px; text-align: center; }
    .signin-card .brand-mark { margin: 0 auto 14px; width: 46px; height: 46px; font-size: 20px; border-radius: 12px; }
    .signin-card h1 { margin: 0 0 6px; font-size: 22px; }
    .signin-card p { color: var(--muted); margin: 0 0 22px; }
    .signin-card .btn { width: 100%; min-height: 44px; font-size: 15px; }

    /* ---------- Professional extras ---------- */
    .segctl { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); }
    .segctl button { min-height: 28px; padding: 0 10px; border: 0; border-radius: 6px; font-size: 13px; font-weight: 550; background: none; color: var(--muted); }
    .segctl button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    a.kpi.link { color: var(--fg); text-decoration: none; transition: border-color .15s, box-shadow .15s; }
    a.kpi.link:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 6px 18px rgba(0, 30, 43, .08); }
    .kpi .label svg { width: 13px; height: 13px; vertical-align: -2px; margin-left: 2px; opacity: 0; transition: opacity .15s; }
    a.kpi.link:hover .label svg, a.kpi.link:focus-visible .label svg { opacity: .8; }
    .icon-btn { width: 32px; padding: 0; }
    .search-open { color: var(--top-muted) !important; min-width: 0; }
    .search-open kbd, .palette kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--top-line); border-radius: 4px; padding: 1px 5px; color: var(--top-muted); }
    .tile-title { margin: 0; font-size: 15.5px; }
    .tile-title a { color: var(--fg); text-decoration: none; }
    .tile-title a:hover { color: var(--accent); text-decoration: underline; }
    .row-link.app-link { display: inline-flex; align-items: center; gap: 8px; }
    a.role-link { color: var(--accent); font-weight: 600; text-decoration: none; }
    a.role-link:hover { text-decoration: underline; }
    a.badge-link { text-decoration: none; }
    a.badge-link:hover { text-decoration: underline; }
    .role-note { color: var(--muted); font-size: 12.5px; }
    .lede { margin: -6px 0 20px; color: var(--muted); max-width: 80ch; }
    .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -.01em; }
    .page-head .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    a.chip { text-decoration: none; color: var(--fg); }
    a.chip:hover { border-color: var(--accent); }
    .avatar.lg { width: 52px; height: 52px; font-size: 18px; background: var(--accent-soft); color: var(--accent); border: 0; }
    .hbar.highlight .fill { background: var(--accent); }
    .hbar.highlight .hbar-label span.t { font-weight: 650; }
    .seg-legend a { color: var(--fg); text-decoration: none; }
    .seg-legend a:hover { color: var(--accent); text-decoration: underline; }

    /* Needs attention */
    .attention { list-style: none; margin: 0; padding: 0; }
    .attention li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 13.5px; }
    .attention li:first-child { border-top: 0; }
    .attention-icon svg { width: 18px; height: 18px; display: block; }
    .attention li.bad .attention-icon { color: var(--bad); }
    .attention li.warn .attention-icon { color: var(--warn); }
    .attention li.info .attention-icon { color: var(--muted); }

    /* Role cards and permissions */
    .role-cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .role-cards > .panel { margin-top: 0; }
    a.role-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; color: var(--fg); text-decoration: none; }
    a.role-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .role-card-head { display: flex; align-items: center; gap: 8px; }
    .role-card-head svg { width: 17px; height: 17px; color: var(--accent); }
    .role-card-head svg:last-child { margin-left: auto; color: var(--muted); }
    .role-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .role-card-foot { font-size: 13px; color: var(--muted); margin-top: auto; }
    .role-card-foot b { color: var(--fg); font-size: 18px; }
    table.matrix th[scope="row"] { font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--fg); background: none; font-weight: 500; position: static; }
    table.matrix td { text-align: center; }
    table.matrix th a { color: inherit; text-decoration: none; }
    table.matrix .hl { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
    table.matrix thead th.hl { color: var(--accent); }
    .perm { display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; }
    .perm.yes { color: var(--ok); }
    .perm.yes svg { width: 17px; height: 17px; }
    .perm.no { color: var(--line-strong); }
    .perm.part { color: var(--fg); font-weight: 500; }

    /* Sortable headers */
    th button.sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
    th button.sort:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
    th .sort-mark::after { content: "↕"; opacity: .35; font-size: 11px; }
    th[aria-sort="ascending"] .sort-mark::after { content: "↑"; opacity: 1; }
    th[aria-sort="descending"] .sort-mark::after { content: "↓"; opacity: 1; }
    th.num button.sort { flex-direction: row-reverse; }

    /* Search */
    dialog.palette { width: min(640px, calc(100vw - 32px)); margin-top: 12vh; padding: 0; overflow: hidden; }
    .palette-input { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .palette-input svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
    .palette-input input { border: 0; box-shadow: none !important; padding: 6px 0; font-size: 16px; background: none; }
    .palette kbd { border-color: var(--line); color: var(--muted); }
    #palette-list { list-style: none; margin: 0; padding: 6px; max-height: min(52vh, 440px); overflow: auto; }
    #palette-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #palette-list li[aria-selected="true"] { background: var(--accent-soft); }
    #palette-list li svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .palette-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .palette-label .sub { color: var(--muted); font-size: 12.5px; margin-left: 8px; }
    .palette-kind { margin-left: auto; font-size: 11.5px; color: var(--muted); flex: none; }
    .palette-status { margin: 0; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

    @media print {
      .topbar, nav.side, .viz-foot, .actions button, .toolbar, .chart-tip { display: none !important; }
      .layout { display: block; }
      .panel { box-shadow: none; break-inside: avoid; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1180px) {
      .grid.two-one, .grid.halves { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .topbar .nav-toggle { display: inline-flex; }
      nav.side {
        position: fixed; top: 56px; left: 0; bottom: 0; height: auto; width: min(300px, 86vw); z-index: 25;
        transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0, 0, 0, .25);
      }
      body.nav-open nav.side { transform: none; }
      .crumb { display: none; }
      .search-kbd { display: none; }
      .account-meta { display: none; }
      .topbar { padding: 0 12px; gap: 10px; }
    }
    @media (max-width: 560px) {
      .page-head h1, .hero h1 { font-size: 21px; }
      .toolbar .search, .toolbar select { max-width: none; width: 100%; }
      th, td { padding: 9px 10px; }
      .brand .brand-text { display: none; }
      .quick-label { display: none; }
      .search-label, .search-kbd { display: none; }
      .hbar { grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Signed out -->
  <div id="view-signin" class="signin" hidden>
    <section class="panel signin-card" aria-labelledby="signin-title">
      <div class="brand-mark" aria-hidden="true">A</div>
      <h1 id="signin-title">AFS Command Center</h1>
      <p>Sign in once with your AFS account to reach the applications you are assigned.</p>
      <a class="btn primary" href="/auth/login">Sign in with AFS SSO</a>
      <p id="signin-message" class="notice" style="margin:18px 0 0" hidden></p>
    </section>
  </div>

  <!-- Signed in -->
  <div id="view-app" hidden>
    <header class="topbar">
      <button type="button" class="btn small nav-toggle" id="nav-toggle" aria-controls="nav" aria-expanded="false" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="#/home" aria-label="AFS Command Center home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text">Command Center</span>
      </a>
      <div class="crumb" aria-label="Location">
        <span class="sep" aria-hidden="true">/</span>
        <span>AFS</span>
        <span class="sep" aria-hidden="true">/</span>
        <b id="crumb-current">Overview</b>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn small search-open" id="search-open" aria-keyshortcuts="Control+K">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="search-label">Search</span><kbd class="search-kbd">Ctrl K</kbd>
      </button>
      <div id="quick-actions"></div>
      <button type="button" class="btn small icon-btn" id="theme-toggle" aria-label="Change theme"></button>
      <div class="account">
        <div class="account-meta">
          <div class="account-name" id="account-name"></div>
          <div class="account-role" id="account-role"></div>
        </div>
        <div class="avatar" id="account-avatar" aria-hidden="true"></div>
        <a class="btn small" href="/auth/logout">Sign out</a>
      </div>
    </header>

    <div class="layout">
      <nav class="side" id="nav" aria-label="Main"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="chart-tip" class="chart-tip" role="tooltip" hidden></div>

<script>
  /* ================= helpers ================= */
  const ADMIN_ROLES = ["super_admin", "access_admin"];
  const ROLE_LABEL = { super_admin: "Super administrator", access_admin: "Access administrator", employee: "Employee" };
  const $ = (sel, root = document) => root.querySelector(sel);
  const state = { me: null, navApps: [] };

  // Builds DOM from text and nodes only. Server values are never parsed as HTML.
  function h(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key === "value") node.value = value;
      else if (key === "checked" || key === "selected" || key === "disabled" || key === "hidden") node[key] = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  // replaceChildren with nested arrays and optional (null/false) parts.
  function fill(root, ...children) {
    root.replaceChildren(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
  }

  function toast(message, isError = false) {
    const node = h("div", { class: "toast" + (isError ? " error" : "") }, message);
    $("#toasts").append(node);
    setTimeout(() => node.remove(), isError ? 6500 : 3800);
  }

  async function api(method, path, body) {
    const options = { method, credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(path, options);
    } catch (_) {
      throw new Error("Cannot reach the server. Check your connection and try again.");
    }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      if (res.status === 401 && path !== "/api/me") showSignedOut();
      const detail = data && data.detail;
      const message = Array.isArray(detail)
        ? detail.map((d) => (d.loc ? d.loc.slice(1).join(" ") + ": " : "") + d.msg).join(" · ")
        : detail || `Something went wrong (HTTP ${res.status}).`;
      throw new Error(message);
    }
    return data;
  }

  function ago(value) {
    if (!value) return "Never";
    const seconds = Math.round((Date.now() - new Date(value).getTime()) / 1000);
    const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
    const units = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];
    for (const [unit, size] of units) {
      if (Math.abs(seconds) >= size) return rtf.format(-Math.round(seconds / size), unit);
    }
    return "just now";
  }

  function fullDate(value) {
    return value ? new Date(value).toLocaleString() : "—";
  }

  function initials(name, email) {
    const source = (name || email || "?").trim();
    const parts = source.split(/\s+/).filter(Boolean);
    return ((parts[0]?.[0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase() || "?";
  }

  function badge(text, tone = "") {
    return h("span", { class: "badge " + tone }, text);
  }

  function statusBadge(enabled) {
    return enabled ? badge("Enabled", "ok") : badge("Disabled", "neutral");
  }

  function emptyState(icon, title, text, action) {
    return h("div", { class: "empty" },
      h("div", { class: "icon", "aria-hidden": "true" }, icon),
      h("h3", null, title),
      h("p", null, text),
      action || null);
  }

  function skeleton() {
    return h("div", { class: "skeleton", "aria-label": "Loading", role: "status" },
      [88, 72, 94, 60, 80].map((w) => h("span", { style: `width:${w}%` })));
  }

  function errorNotice(err, retry) {
    return h("div", { class: "notice bad", role: "alert" },
      h("div", null, err.message),
      retry ? h("div", { style: "margin-top:10px" }, button("Try again", retry, { small: true })) : null);
  }

  function button(label, onClick, options = {}) {
    const classes = [options.primary ? "primary" : "", options.danger ? "danger" : "", options.small ? "small" : ""].filter(Boolean).join(" ");
    return h("button", { type: "button", class: classes, onclick: onClick, disabled: options.disabled, "aria-label": options.ariaLabel }, label);
  }

  function linkButton(label, href, options = {}) {
    return h("a", { class: "btn" + (options.primary ? " primary" : "") + (options.small ? " small" : ""), href, target: options.external ? "_blank" : null, rel: options.external ? "noopener noreferrer" : null }, label);
  }

  function field({ label, name, type = "text", value = "", required = false, hint = "", pattern, options, min, max }) {
    const id = `f-${name}-${Math.random().toString(36).slice(2, 7)}`;
    let control;
    if (options) {
      control = h("select", { id, name, required }, options.map((o) => h("option", { value: o.value }, o.label)));
      control.value = value; // an empty value selects a placeholder option when one exists
    } else if (type === "textarea") {

          ...users.map((u) => ({ kind: "Employee", label: u.display_name || u.email, sub: u.display_name ? u.email : "", href: "#/employee/" + u.id, icon: "person" })),
          ...catalog.platform_roles.map((r) => ({ kind: "Platform role", label: ROLE_LABEL[r.name], href: "#/platform-role/" + r.name, icon: "shield" })),
          ...catalog.roles.map((r) => ({ kind: "Role", label: r.name, sub: r.application_name, href: "#/role/" + r.id, icon: "shield" })));
        if (paletteOpen) paint();
      } catch (_) {
        status.textContent = "Employees and roles could not be loaded.";
      }
    }
  }
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openPalette(); }
    else if (e.key === "/" && !typing && !document.querySelector("dialog[open]")) { e.preventDefault(); openPalette(); }
  });

  function pageHead(title, description, actions) {
    return h("div", { class: "page-head" },
      h("div", null, h("h1", null, title), description ? h("p", null, description) : null),
      actions ? h("div", { class: "actions" }, actions) : null);
  }

  function sectionTitle(title, description, actions) {
    return h("div", { class: "section-title" },
      h("div", null, h("h2", null, title), description ? h("p", null, description) : null),
      actions ? h("div", { class: "actions" }, actions) : null);
  }

  function panel(title, description, body, { actions, id, flush } = {}) {
    return h("section", { class: "panel", id: id || null, "aria-label": title },
      h("div", { class: "panel-head" }, h("div", null, h("h2", null, title), description ? h("p", null, description) : null),
        actions ? h("div", { class: "actions" }, actions) : null),
      h("div", { class: "panel-body" + (flush ? " flush" : "") }, body));
  }

  // Links used across pages, so every person, role and application name leads to its own page.
  const appHref = (slug) => "#/app/" + encodeURIComponent(slug);
  const personLink = (id, label) => (id ? h("a", { href: "#/employee/" + id, class: "row-link" }, label) : label);
  const roleLink = (id, label) => (id ? h("a", { href: "#/role/" + id, class: "role-link mono" }, label) : label);
  const appLink = (slug, name) => h("a", { href: appHref(slug), class: "row-link app-link" },
    h("span", { class: "swatch", style: `background:${appColor(colorOfSlug(slug))}` }), name);
  const whenCell = (value, empty = "Never") => ({ node: h("span", { title: fullDate(value) }, value ? ago(value) : empty), sort: value || "" });

  let navigation = 0;

  function parseRoute() {
    const [route, param, sub] = (location.hash.replace(/^#\/?/, "") || "home").split("/").map((p) => decodeURIComponent(p || ""));
    return { route, param: param || "", sub: sub || "" };
  }

  async function navigate() {
    if (!state.me) return;
    const attempt = ++navigation; // a newer navigation supersedes this one, so only the latest render is shown
    const current = parseRoute();
    const allowed = allowedRoutes();
    const route = allowed.find((r) => r.id === current.route) || allowed[0];
    if (route.id !== current.route) {
      history.replaceState(null, "", "#/" + route.id);
      Object.assign(current, { route: route.id, param: "", sub: "" });
    }
    document.body.classList.remove("nav-open");
    $("#nav-toggle").setAttribute("aria-expanded", "false");
    disconnectCharts();
    renderNav(current);
    state.crumb = null;
    const setCrumb = () => {
      const app = route.id === "app" ? (state.navApps || []).find((a) => a.slug === current.param) : null;
      $("#crumb-current").textContent = state.crumb || (route.id === "home" ? "Overview" : app ? app.name : route.label);
    };
    setCrumb();
    // Refresh the application list in the background so the menu follows registrations and status changes.
    loadNavApps().then(() => { if (attempt === navigation) { renderNav(current); setCrumb(); } }).catch(() => {});
    const main = $("#main");
    main.replaceChildren(skeleton());
    try {
      const content = document.createElement("div");
      await route.render(content, current.param, current.sub);
      if (attempt !== navigation) return;
      main.replaceChildren(...content.childNodes);
      setCrumb();
      document.title = `${$("#crumb-current").textContent} · AFS Command Center`;
    } catch (err) {
      if (attempt !== navigation) return;
      main.replaceChildren(pageHead(route.label), errorNotice(err, navigate));
    }
    const target = current.sub && document.getElementById("section-" + current.sub);
    if (target) target.scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  function showSignedOut(message) {
    state.me = null;
    $("#view-app").hidden = true;
    $("#view-signin").hidden = false;
    const note = $("#signin-message");
    note.hidden = !message;
    note.textContent = message || "";
  }

  // null scope means no limit (super administrator); otherwise only the listed applications.
  const managesApp = (applicationId) => {
    const scope = state.me && state.me.managed_application_ids;
    return scope === null || scope === undefined || scope.includes(applicationId);
  };

  function showSignedIn(me) {
    state.me = me;
    $("#view-signin").hidden = true;
    $("#view-app").hidden = false;
    const name = me.name || me.email;
    $("#account-name").textContent = name;
    $("#account-role").textContent = ROLE_LABEL[me.platform_role] || me.platform_role;
    $("#account-avatar").textContent = initials(me.name, me.email);
    document.title = "AFS Command Center";
    renderQuickActions();
    const toggle = $("#nav-toggle");
    toggle.onclick = () => {
      const open = document.body.classList.toggle("nav-open");
      toggle.setAttribute("aria-expanded", String(open));
    };
    $("#search-open").onclick = openPalette;
    $("#theme-toggle").onclick = cycleTheme;
    applyTheme(readPref("afs.theme", "system"));
  }

  /* ================= Charts ================= */
  // Plain SVG and HTML, built from numbers and text only. Every chart has a hover tooltip and a table view.

  const SVG_NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, ...children) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attrs || {})) if (value !== null && value !== undefined) node.setAttribute(key, value);
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    return node;
  }

  const numberFormat = new Intl.NumberFormat();
  const compactFormat = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
  const num = (n) => (Math.abs(n) >= 10000 ? compactFormat.format(n) : numberFormat.format(n));
  const sum = (values) => values.reduce((n, v) => n + Number(v || 0), 0);
  const dayDate = (iso) => { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const shortDay = (iso) => dayDate(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const longDay = (iso) => dayDate(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const weekOf = (iso) => "Week of " + shortDay(iso);
  const dateOnly = (value) => (value ? new Date(value).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—");
  const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) + "%" : "0%");
  const plural = (n, word, many = word + "s") => `${num(n)} ${n === 1 ? word : many}`;
  const durationDays = (days) => (days === null || days === undefined ? "—" : days < 1 ? "Under a day" : days < 60 ? plural(days, "day") : days < 730 ? plural(Math.round(days / 30.4), "month") : plural(Math.round(days / 365), "year"));

  // Four clean, whole-number intervals that cover the largest value.
  function niceStep(max) {
    const raw = max / 4;
    if (raw <= 1) return 1;
    const power = 10 ** Math.floor(Math.log10(raw));
    for (const m of [1, 2, 2.5, 5, 10]) {
      const step = m * power;
      if (step >= raw && Number.isInteger(step)) return step;
    }
    return 10 * power;
  }

  const tip = () => $("#chart-tip");
  function showTip(event, title, rows) {
    const node = tip();
    node.replaceChildren(h("div", { class: "tip-title" }, title), rows.map((r) =>
      h("div", { class: "tip-row" + (r.total ? " total" : "") },
        r.color ? h("span", { class: "swatch", style: `background:${r.color}` }) : null,
        h("span", null, r.label), h("b", null, typeof r.value === "number" ? num(r.value) : r.value))));
    node.hidden = false;
    const { innerWidth: vw, innerHeight: vh } = window;
    const rect = node.getBoundingClientRect();
    let x = event.clientX + 14, y = event.clientY + 14;
    if (x + rect.width > vw - 8) x = event.clientX - rect.width - 14;
    if (y + rect.height > vh - 8) y = event.clientY - rect.height - 14;
    node.style.left = Math.max(8, x) + "px";
    node.style.top = Math.max(8, y) + "px";
  }
  const hideTip = () => { tip().hidden = true; };

  // Charts draw at their real width, and redraw when it changes. Observers are released on every navigation.
  const chartObservers = [];
  function disconnectCharts() {
    while (chartObservers.length) chartObservers.pop().disconnect();
    hideTip();
  }
  function chartBox(draw, height) {
    const box = h("div", { class: "chart", style: `height:${height}px` });
    let lastWidth = 0;
    const observer = new ResizeObserver((entries) => {
      const width = Math.floor(entries[0].contentRect.width);
      if (width && width !== lastWidth) { lastWidth = width; box.replaceChildren(draw(width, height)); }
    });
    observer.observe(box);
    chartObservers.push(observer);
    return box;
  }

  // Rounded at the data end (top), square at the baseline.
  function columnPath(x, y, w, hgt, r) {
    r = Math.max(0, Math.min(r, w / 2, hgt));
    return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
  }

  function vizTable(columns, rows, label) {
    return h("div", { class: "viz-table" }, table(columns.map((c, i) => ({ label: c, className: i ? "num" : null })),
      rows.map((r) => r.map((cell, i) => (i ? { className: "num", node: num(cell) } : cell))), { label }));
  }

  function withTableToggle(figure, tableNode) {
    tableNode.hidden = true;
    const toggle = h("button", { type: "button", class: "link", "aria-expanded": "false", onclick: () => {
      tableNode.hidden = !tableNode.hidden;
      toggle.setAttribute("aria-expanded", String(!tableNode.hidden));
      toggle.textContent = tableNode.hidden ? "Show as table" : "Hide table";
    } }, "Show as table");
    figure.append(h("div", { class: "viz-foot" }, toggle), tableNode);
    return figure;
  }

  // Columns per day (or per week), stacked when there is more than one series. series: [{ name, color, values }]
  function columnChart({ days, series, height = 230, label, tipTitle = longDay, axisLabel = shortDay }) {
    const totals = days.map((_, i) => sum(series.map((s) => s.values[i])));
    const step = niceStep(Math.max(0, ...totals));
    const max = step * 4;
    const figure = h("figure", { class: "viz" });
    if (series.length > 1) {
      figure.append(h("ul", { class: "legend", "aria-label": "Legend" }, series.map((s) =>
        h("li", null, h("span", { class: "swatch", style: `background:${s.color}` }), s.name, h("b", null, num(sum(s.values)))))));
    }
    figure.append(chartBox((width, hgt) => {
      const padL = 40, padR = 6, padT = 8, padB = 24;
      const plotW = width - padL - padR, plotH = hgt - padT - padB;
      const slot = plotW / days.length;
      const barW = Math.max(1.5, Math.min(24, slot * 0.68, slot - 2));
      const y = (v) => padT + plotH - (v / max) * plotH;
      const root = svg("svg", { width, height: hgt, role: "img", "aria-label": label });
      for (let t = 0; t <= 4; t++) {
        const yy = Math.round(y(step * t)) + 0.5;
        root.append(svg("line", { x1: padL, x2: width - padR, y1: yy, y2: yy, class: t ? "grid-line" : "base-line" }),
          svg("text", { x: padL - 8, y: yy + 4, "text-anchor": "end", class: "tick" }, num(step * t)));
      }
      // As many axis labels as fit (about one per 64px), counted back from the most recent column.
      const fits = Math.max(2, Math.floor(plotW / 64));
      const labelEvery = Math.max(1, Math.ceil(days.length / fits));
      days.forEach((day, i) => {
        if ((days.length - 1 - i) % labelEvery === 0) {
          root.append(svg("text", { x: padL + slot * i + slot / 2, y: hgt - 6, "text-anchor": "middle", class: "tick" }, axisLabel(day)));
        }
        const hit = svg("rect", { x: padL + slot * i, y: padT, width: slot, height: plotH, class: "hit" });
        const rows = series.length === 1
          ? [{ label: series[0].name, value: series[0].values[i], color: series[0].color }]
          : [...series.filter((s) => s.values[i] > 0).map((s) => ({ label: s.name, value: s.values[i], color: s.color })),
             { label: "Total", value: totals[i], total: true }];
        hit.addEventListener("pointermove", (e) => showTip(e, tipTitle(day), rows));
        hit.addEventListener("pointerleave", hideTip);
        root.append(hit);
      });
      days.forEach((_, i) => {
        const x = padL + slot * i + (slot - barW) / 2;
        const parts = series.filter((s) => s.values[i] > 0);
        let base = y(0);
        parts.forEach((s, k) => {
          const top = y(0) - (sum(parts.slice(0, k + 1).map((p) => p.values[i])) / max) * plotH;
          const bottom = base - (k ? 2 : 0); // 2px surface gap between stacked segments
          if (bottom - top > 0.5) {
            root.append(svg("path", { class: "bar", fill: s.color, d: columnPath(x, top, barW, bottom - top, k === parts.length - 1 ? 4 : 0) }));
          }
          base = top;
        });
      });
      return root;
    }, height));
    const columns = ["Period", ...series.map((s) => s.name), ...(series.length > 1 ? ["Total"] : [])];
    const rows = days.map((d, i) => [tipTitle(d), ...series.map((s) => s.values[i]), ...(series.length > 1 ? [totals[i]] : [])]).reverse();
    return withTableToggle(figure, vizTable(columns, rows, label + " (table)"));
  }

  function sparkline(values, color = "var(--s-neutral)", width = 96, height = 30) {
    const max = Math.max(1, ...values);
    const stepX = (width - 8) / Math.max(1, values.length - 1);
    const pts = values.map((v, i) => [4 + i * stepX, height - 4 - (v / max) * (height - 8)]);
    const line = pts.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1)).join("");
    const [ex, ey] = pts[pts.length - 1];
    return svg("svg", { class: "spark", width, height, viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: "none", "aria-hidden": "true" },
      svg("path", { d: `${line}L${ex},${height - 4}L4,${height - 4}Z`, fill: color, "fill-opacity": "0.1", stroke: "none" }),
      svg("path", { d: line, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }),
      svg("circle", { cx: ex, cy: ey, r: 3.5, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  }

  // One measure across categories, largest first. items: [{ label, value, href, color, highlight }]
  function hbars(items, { label, unit = "", keepOrder = false } = {}) {
    const max = Math.max(1, ...items.map((i) => i.value));
    const sorted = keepOrder ? items : [...items].sort((a, b) => b.value - a.value || a.label.localeCompare(b.label));
    const figure = h("figure", { class: "viz" },
      h("div", { class: "hbars", role: "list", "aria-label": label }, sorted.map((item) =>
        h("div", { class: "hbar" + (item.highlight ? " highlight" : ""), role: "listitem" },
          h("div", { class: "hbar-label" },
            item.color ? h("span", { class: "swatch", style: `background:${item.color}` }) : null,
            item.href ? h("a", { href: item.href, title: item.label }, item.label) : h("span", { class: "t", title: item.label }, item.label)),
          h("div", { class: "track", onpointermove: (e) => showTip(e, item.label, [{ label: unit || label, value: item.value }]), onpointerleave: hideTip },
            item.value ? h("div", { class: "fill", style: `width:${(item.value / max) * 100}%` }) : null),
          h("span", { class: "val" }, item.display ?? num(item.value))))));
    return withTableToggle(figure, vizTable(["Item", unit || label], sorted.map((i) => [i.label, i.value]), label + " (table)"));
  }

  // Parts of one whole. parts: [{ label, value, color, href }]
  function segmented(parts, { label }) {
    const total = sum(parts.map((p) => p.value));
    return h("div", null,
      h("div", { class: "seg", role: "img", "aria-label": `${label}: ` + parts.map((p) => `${p.label} ${p.value}`).join(", ") },
        parts.filter((p) => p.value > 0).map((p) => h("span", {
          style: `flex:${p.value} 1 0;background:${p.color}`,
          onpointermove: (e) => showTip(e, label, [{ label: p.label, value: p.value, color: p.color }]), onpointerleave: hideTip,
        }))),
      h("ul", { class: "seg-legend" }, parts.map((p) => h("li", null,
        h("span", { class: "swatch", style: `background:${p.color}` }),
        p.href ? h("a", { href: p.href }, p.label) : h("span", null, p.label),
        h("b", null, num(p.value)), h("span", { class: "pct" }, pct(p.value, total))))));
  }

  // A stat tile. With `href` the whole tile is a link to the page holding the detail.
  function kpi(label, value, { sub, delta, spark, unit, href } = {}) {
    const content = [
      h("div", { class: "label" }, label, href ? icon("chevron") : null),
      h("div", { class: "row" },
        h("div", { class: "value" }, value, unit ? h("small", null, " " + unit) : null),
        spark || null),
      delta || sub ? h("div", { class: "sub" }, delta || null, delta && sub ? " " : null, sub || null) : null,
    ];
    return href ? h("a", { class: "panel kpi link", href }, content) : h("div", { class: "panel kpi" }, content);
  }

  function deltaChip(current, previous, period) {
    if (!previous && !current) return h("span", { class: "delta flat" }, "No change");
    if (!previous) return h("span", { class: "delta up", title: `None in the previous ${period}` }, "New");
    const change = Math.round(((current - previous) / previous) * 100);
    const tone = change > 0 ? "up" : change < 0 ? "down" : "flat";
    return h("span", { class: "delta " + tone, title: `Compared with the previous ${period}` }, (change > 0 ? "+" : "") + change + "%");
  }

  // ---------- Activity wording shared by every feed ----------
  const ACTION_LABEL = {
    "assignment.grant": "granted access", "assignment.update": "changed a role", "assignment.revoke": "revoked access",
    "user.create": "added an employee", "user.update": "updated an employee", "user.delete": "removed an employee", "user.invite": "sent an invitation",
    "application.create": "registered an application", "application.update": "updated an application",
    "role_mapping.create": "added a role", "role_mapping.delete": "deleted a role", "role_mapping.list": "listed roles", "role.view": "opened a role",
    "app_scope.update": "changed an administrator's scope",
    "identity.link": "linked their AFS identity", "user.provision": "was provisioned on first sign-in",
    "platform_role.bootstrap": "became super administrator", "access.denied": "was denied access",
    "notification.sent": "sent a notification", "notification.failed": "could not send a notification",
  };
  const capitalize = (text) => text.replace(/^./, (c) => c.toUpperCase());
  const actionText = (action) => ACTION_LABEL[action] || action;

  // items: [{ occurred_at, outcome, actor, text, app: { slug, name } , extra }]
  function feed(items, emptyTitle, emptyText) {
    if (!items.length) return emptyState(icon("log"), emptyTitle, emptyText);
    return h("ul", { class: "feed" }, items.map((e) => h("li", null,
      h("span", { class: "dot " + (e.outcome || "success"), title: e.outcome === "failure" ? "Refused or failed" : "Succeeded" }),
      h("span", { class: "what" },
        e.actor ? [h("b", null, e.actor), " "] : null, e.text,
        e.outcome === "failure" ? h("span", { class: "sub" }, " (refused)") : null,
        e.extra ? h("span", { class: "sub" }, " · ", e.extra) : null,
        e.app && e.app.slug ? h("span", { class: "sub" }, " · ", h("a", { href: appHref(e.app.slug) }, e.app.name || e.app.slug)) : null),
      h("span", { class: "when", title: fullDate(e.occurred_at) }, ago(e.occurred_at)))));
  }

  /* ================= Home: statistics overview ================= */
  // Each page shows only what is its own: the home page holds organisation-wide trends and what needs attention;
  // people, roles and per-application detail live on their own pages, one click away.

  function healthBadge(app) {
    if (!app.enabled) return badge("Disabled", "neutral");
    const health = HEALTH[app.health] || HEALTH.not_connected;
    return badge(health.label, health.tone);
  }

  function attentionItems(data) {
    const items = [];
    for (const a of data.applications) {
      if (a.enabled && a.health === "error") items.push({ tone: "bad", text: `${a.name} is failing${a.last_error ? `: ${a.last_error}` : ""}`, href: appHref(a.slug) + "/health" });
    }
    for (const a of data.applications) {
      if (a.enabled && a.health === "not_connected") items.push({ tone: "warn", text: `${a.name} is enabled but has not checked access through Command Center yet`, href: appHref(a.slug) + "/health" });
      if (a.managed && !a.enabled && a.people > 0) items.push({ tone: "warn", text: `${a.name} is disabled, but ${plural(a.people, "person", "people")} still hold access`, href: appHref(a.slug) + "/people" });
      if (a.managed && a.enabled && !a.roles.length && a.people > 0) items.push({ tone: "info", text: `${a.name} has no roles defined, so everyone with access has standard access`, href: appHref(a.slug) + "/roles" });
      if (a.managed && a.failures_7d > 0 && a.health !== "error") items.push({ tone: "info", text: `${a.name} reported ${plural(a.failures_7d, "failure")} in the last 7 days`, href: appHref(a.slug) + "/health" });
    }
    const t = data.totals;
    if (t.employees_pending) items.push({ tone: "info", text: `${plural(t.employees_pending, "employee")} ${t.employees_pending === 1 ? "has" : "have"} not signed in for the first time`, href: "#/employees" });
    const refused = sum(data.sign_ins.failure);
    if (refused) items.push({ tone: "info", text: `${plural(refused, "sign-in")} refused in the last ${data.period_days} days`, href: "#/audit" });
    return items;
  }

  function attentionList(items) {
    if (!items.length) {
      return h("div", { class: "empty small" }, h("div", { class: "icon", "aria-hidden": "true" }, icon("check")),
        h("h3", null, "All clear"), h("p", null, "No failing integrations, idle applications or waiting accounts."));
    }

  function appTile(app, data) {
    const color = appColor(app.color_index);
    const href = appHref(app.slug);
    const stat = (label, value) => h("div", null, h("dt", null, label), h("dd", null, value));
    return h("article", { class: "panel app-tile" },
      h("div", { class: "app-head" },
        h("div", { class: "app-icon", style: appTint(app.color_index), "aria-hidden": "true" }, app.name.charAt(0).toUpperCase()),
        h("div", { style: "min-width:0" }, h("h3", { class: "tile-title" }, h("a", { href }, app.name)),
          h("span", { class: "sub mono" }, app.slug))),
      h("div", { class: "badges" }, app.enabled ? badge("Enabled", "accent") : badge("Disabled", "neutral"), app.enabled ? healthBadge(app) : null,
