          linkButton("Overview", href, { small: true }),
          app.enabled && app.launch_url ? h("a", { class: "btn small", href: app.launch_url, target: "_blank", rel: "noopener noreferrer", "aria-label": `Launch ${app.name} (opens in a new tab)` }, "Launch", icon("external")) : null)));
  }

  async function renderHome(root) {
    if (!isAdmin()) return renderEmployeeHome(root);
    const [data, mine] = await Promise.all([api("GET", `/api/admin/overview?days=${state.period}`), api("GET", "/api/apps")]);
    const t = data.totals;
    const apps = data.applications;
    const scoped = apps.filter((a) => a.managed);
    const appsBySlug = Object.fromEntries(apps.map((a) => [a.slug, a]));
    const first = (state.me.name || state.me.email).split(" ")[0];
    const period = `${data.period_days} days`;
    const signIns = sum(data.sign_ins.success);
    const refused = sum(data.sign_ins.failure);
    const sessionsDaily = data.days.map((_, i) => sum(apps.map((a) => (a.sessions_daily ? a.sessions_daily[i] : 0))));

    const kpis = h("div", { class: "kpis" },
      kpi("Applications", num(t.applications), { sub: `${t.applications_enabled} enabled · ${t.applications - t.applications_enabled} disabled`, href: "#/applications" }),
      kpi("Active employees", num(t.employees_active), { sub: `${t.signed_in_period} signed in, ${period} · ${t.employees_disabled} disabled`, href: "#/employees" }),
      kpi("People with access", num(t.users_with_access), { sub: `${num(t.assignments)} assignments · +${t.granted} / −${t.revoked}`, href: "#/assignments" }),
      data.can_see_usage
        ? kpi(`Sessions, ${period}`, num(t.sessions_total), { delta: deltaChip(t.sessions_total, t.sessions_prev, period), sub: `${num(t.sessions_7d)} this week`, spark: sparkline(sessionsDaily), href: "#/usage" })
        : null,
      kpi(`Sign-ins, ${period}`, num(signIns), { delta: deltaChip(signIns, t.sign_ins_prev, period), sub: `${t.signed_in_7d} people this week`, spark: sparkline(data.sign_ins.success), href: "#/audit" }),
      kpi("Healthy integrations", `${t.applications_connected}`, { unit: `of ${t.applications_enabled} enabled`,
        sub: t.applications_failing ? badge(`${t.applications_failing} failing`, "bad") : "None failing", href: "#/integrations" }));

    // Sessions stacked by application. More than eight series fold the smallest into "Other".
    let sessionSeries = apps.filter((a) => a.sessions_total > 0).sort((a, b) => b.sessions_total - a.sessions_total)
      .map((a) => ({ name: a.name, color: appColor(a.color_index), values: a.sessions_daily }));
    if (sessionSeries.length > 8) {
      const rest = sessionSeries.slice(7);
      sessionSeries = [...sessionSeries.slice(0, 7), { name: "Other", color: "var(--s-other)", values: data.days.map((_, i) => sum(rest.map((s) => s.values[i]))) }];
    }
    const signInPanel = panel("Sign-ins per day", `Successful AFS sign-ins. ${plural(refused, "refused sign-in")} in ${period}.`,
      columnChart({ days: data.days, series: [{ name: "Sign-ins", color: "var(--s-neutral)", values: data.sign_ins.success }], label: "Sign-ins per day" }));
    const changesPanel = panel("Access changes", data.scope === "all" ? "Access granted and revoked per day" : "Granted and revoked in the applications you manage",
      t.granted + t.revoked
        ? columnChart({ days: data.days, series: [
            { name: "Granted", color: "var(--s1)", values: data.access_changes.granted },
            { name: "Revoked", color: "var(--s2)", values: data.access_changes.revoked }], label: "Access changes per day" })
        : emptyState(icon("key"), "No changes in this period", "Grants and revocations appear here."));

    const collection = h("div", { class: "app-grid" },
      apps.map((a) => appTile(a, data)),
      isSuper() ? h("button", { type: "button", class: "panel add-tile", onclick: registerApplication },
        h("span", null, h("span", { class: "empty", style: "padding:0;display:block" }, h("span", { class: "icon" }, icon("plus"))),
          h("strong", { style: "display:block;color:var(--fg)" }, "Register an application"),
          h("span", { style: "font-size:13px" }, "It appears in the menu and in every statistic."))) : null);

    const roles = data.platform_roles;
    const peoplePanel = panel("People and roles", "Everyone with an AFS account", h("div", null,
      h("div", { class: "seg-block" }, h("h3", null, "Platform role"),
        segmented(["super_admin", "access_admin", "employee"].map((name, i) => ({
          label: ROLE_LABEL[name], value: roles[name], color: `var(--s${i + 1})`, href: "#/platform-role/" + name })), { label: "Platform role" })),
      h("div", { class: "seg-block" }, h("h3", null, "Account status"),
        segmented([
          { label: "Active, signed in before", value: t.employees_active - t.employees_pending, color: "var(--s1)" },
          { label: "Waiting for first sign-in", value: t.employees_pending, color: "var(--s2)" },
          { label: "Disabled", value: t.employees_disabled, color: "var(--s3)" },
        ], { label: "Account status" }))), { actions: linkButton("All roles", "#/roles", { small: true }) });

    const attention = attentionItems(data);
    const attentionPanel = panel("Needs attention", attention.length ? plural(attention.length, "item") : "Nothing to follow up", attentionList(attention), { flush: true });
    const activityPanel = panel("Recent activity", "Latest changes to access", feed(data.recent_activity.slice(0, 6).map((e) => ({
      occurred_at: e.occurred_at, outcome: e.outcome, actor: e.actor_name || "System", text: actionText(e.action),
      app: e.application_slug ? { slug: e.application_slug, name: (appsBySlug[e.application_slug] || {}).name } : null,
    })), "No activity yet", "Changes to access appear here as they happen."), { flush: true, actions: linkButton("Audit log", "#/audit", { small: true }) });

    fill(root,
      h("section", { class: "hero" },
        h("div", null,
          h("p", { class: "eyebrow" }, ROLE_LABEL[state.me.platform_role] || "Administrator"),
          h("h1", null, `Welcome, ${first}`),
          h("p", null, `Every application AFS manages, who can reach it, and how it is used. ${plural(apps.length, "application")} registered.`)),
        h("div", { class: "actions" },
          periodPicker(),
          h("span", { class: "chip", title: fullDate(data.generated_at) }, "Updated ", ago(data.generated_at)),
          h("button", { type: "button", class: "small", onclick: navigate, "aria-label": "Refresh figures" }, icon("refresh")))),
      data.scope === "managed"
        ? h("p", { class: "notice", style: "margin:0 0 16px" }, `Access figures cover the ${plural(scoped.length, "application")} you manage. Session counts are shown to super administrators.`)
        : null,
      kpis,
      data.can_see_usage
        ? h("div", { class: "grid two-one" },
            panel("Sessions per day by application", `Each time Command Center grants an application access. Last ${period}.`,
              sessionSeries.length ? columnChart({ days: data.days, series: sessionSeries, label: "Sessions per day by application" })
                : emptyState(icon("chart"), "No sessions yet", "Sessions appear once integrated applications check access through Command Center.")),
            signInPanel)
        : h("div", { class: "grid halves" }, signInPanel, changesPanel),
      sectionTitle("Applications managed by AFS", "New registrations appear here, in the menu and in every statistic automatically.",
        isSuper() ? linkButton("Manage applications", "#/applications", { small: true }) : null),
      collection,
      data.can_see_usage
        ? [h("div", { class: "grid halves" }, changesPanel, peoplePanel), h("div", { class: "grid two-one" }, attentionPanel, activityPanel)]
        : [h("div", { class: "grid halves" }, attentionPanel, peoplePanel), h("div", { class: "grid" }, activityPanel)],
      mine.length ? [sectionTitle("Your applications", "Applications assigned to you. Each opens in a new tab."), h("div", { class: "cards" }, mine.map((a) => appCard(a)))] : null);
  }

  /* ================= Portal: employee home ================= */

  // `detail` (from /api/me/overview) adds what the employee's role allows and since when they have had access.
  function appCard(app, detail) {
    return h("article", { class: "panel card" },
      h("div", { class: "app-head" }, h("div", { class: "app-icon", "aria-hidden": "true" }, app.name.charAt(0).toUpperCase()), h("h3", null, app.name)),
      h("p", null, app.description || "No description."),
      h("div", { class: "meta" },
        app.role_name ? h("div", null, "Your role: ", h("b", null, app.role_name)) : h("div", null, "Standard access"),
        detail && detail.role_description ? h("div", { class: "role-note" }, detail.role_description) : null,
        detail ? h("div", null, "Access since ", h("b", { title: fullDate(detail.granted_at) }, dateOnly(detail.granted_at)),
          detail.granted_by ? [" · granted by ", h("b", null, detail.granted_by)] : null) : null,
        app.available ? null : badge("Unavailable", "bad")),
      h("div", { class: "foot" },
        app.available
          ? h("span", { class: "actions" },
              linkButton("Open", app.launch_url, { primary: true, external: true }))
          : h("span", { class: "muted" }, "Temporarily unavailable. Try again later.")));
  }

  const MY_CHANGE = {
    "assignment.grant": "Access granted", "assignment.update": "Role changed", "assignment.revoke": "Access removed",
    "user.create": "Account created", "user.update": "Account details changed", "user.invite": "Invitation sent", "identity.link": "AFS identity linked",
    "user.provision": "Account created at first sign-in", "platform_role.bootstrap": "Made super administrator",
  };

  // Every application the employee is assigned to, with their role and its history. Each card opens the application in a new tab.
  async function renderEmployeeHome(root) {
    const [apps, me] = await Promise.all([api("GET", "/api/apps"), api("GET", "/api/me/overview")]);
    const first = (state.me.name || state.me.email).split(" ")[0];
    const detailBySlug = Object.fromEntries(me.access.map((a) => [a.application_slug, a]));
    const unavailable = apps.filter((a) => !a.available).length;
    const summary = apps.length === 0
      ? "No applications are assigned to you yet."
      : `${apps.length} application${apps.length === 1 ? "" : "s"} assigned to you${unavailable ? `, ${unavailable} temporarily unavailable` : ""}.`;
    const signIns = sum(me.sign_ins.success);
    const previous = me.sign_ins.recent.filter((s) => s.outcome === "success")[1];

    const signInList = me.sign_ins.recent.length
      ? h("ul", { class: "feed" }, me.sign_ins.recent.map((s) => h("li", null,
          h("span", { class: "dot " + s.outcome }),
          h("span", { class: "what" }, s.outcome === "success" ? "Signed in" : "Sign-in refused"),
          h("span", { class: "when", title: fullDate(s.occurred_at) }, ago(s.occurred_at)))))
      : emptyState(icon("person"), "No sign-ins recorded", "Your sign-ins appear here.");

    fill(root,
      h("section", { class: "hero" },
        h("div", null,
          h("p", { class: "eyebrow" }, ROLE_LABEL[state.me.platform_role] || "Employee"),
          h("h1", null, `Welcome, ${first}`),
          h("p", null, summary))),
      h("div", { class: "kpis", style: "margin-bottom:20px" },
        kpi("Available now", num(apps.length - unavailable), { unit: `of ${apps.length}` }),
        kpi("Sign-ins, 30 days", num(signIns), { spark: sparkline(me.sign_ins.success) }),
        kpi("Previous sign-in", previous ? ago(previous.occurred_at) : "—", { sub: previous ? fullDate(previous.occurred_at) : "This is your first" }),
        kpi("Member since", dateOnly(me.account.created_at), { sub: me.account.email })),
      apps.length
        ? h("div", { class: "cards" }, apps.map((a) => appCard(a, detailBySlug[a.slug])))
        : emptyState(icon("apps"), "Nothing to open yet", "Ask an access administrator to assign the applications you need."),
      h("div", { class: "grid halves", style: "margin-top:20px" },
        panel("Changes to your access", "Granted, changed and removed access, and account changes", feed(me.changes.map((c) => ({
          occurred_at: c.occurred_at, outcome: c.outcome, text: MY_CHANGE[c.action] || capitalize(actionText(c.action)),
          extra: c.actor_name ? `by ${c.actor_name}` : null,
          app: c.application_slug ? { slug: c.application_slug, name: c.application_name } : null,
        })), "No changes yet", "When your access changes, it is listed here."), { flush: true }),
        panel("Your recent sign-ins", "If you do not recognise one, tell an administrator.", signInList, { flush: true })),
      me.past_access.length
        ? h("div", { class: "grid" }, panel("Access you no longer have", null, table(
            [{ label: "Application" }, { label: "Role" }, { label: "From" }, { label: "Until" }],
            me.past_access.map((a) => [a.application_name, a.role_name || "Standard access", dateOnly(a.granted_at), dateOnly(a.revoked_at)]),
            { label: "Past access" }), { flush: true }))
        : null);
  }

  /* ================= Application page ================= */

  async function renderApp(root, slug) {
    if (!isAdmin()) return renderEmployeeApp(root, slug);
    const data = await api("GET", `/api/admin/overview?days=${state.period}`);
    const app = data.applications.find((a) => a.slug === slug);
    if (!app) {
      fill(root, pageHead("Application"), h("div", { class: "panel" },
        emptyState(icon("box"), "Application not found", "It may have been renamed. Pick one from the menu.", linkButton("Back to overview", "#/home", { small: true }))));
      return;
    }
    state.crumb = app.name;
    const color = appColor(app.color_index);
    const period = `${data.period_days} days`;
    const head = h("div", { class: "page-head" },
      h("div", { class: "app-head" },
        h("div", { class: "app-icon lg", style: appTint(app.color_index), "aria-hidden": "true" }, app.name.charAt(0).toUpperCase()),
        h("div", null,
          h("h1", null, app.name),
          h("div", { class: "actions", style: "gap:6px" }, h("span", { class: "mono muted" }, app.slug),
            app.enabled ? badge("Enabled", "accent") : badge("Disabled", "neutral"), app.enabled ? healthBadge(app) : null,
            h("span", { class: "muted", style: "font-size:12.5px" }, "Registered " + dateOnly(app.created_at))))),
      h("div", { class: "actions" },
        periodPicker(),
        app.enabled && app.launch_url ? h("a", { class: "btn primary", href: app.launch_url, target: "_blank", rel: "noopener noreferrer" }, "Launch app", icon("external")) : null,
        isSuper() ? button("Edit", () => editApplication(app)) : null,
        isSuper() ? button(app.enabled ? "Disable" : "Enable", () => toggleApplication(app), { danger: app.enabled }) : null));
    const description = app.description ? h("p", { class: "muted", style: "margin:-8px 0 20px;max-width:80ch" }, app.description) : null;

    if (!app.managed) {
      fill(root, head, description,
        h("p", { class: "notice" }, "You do not manage access to this application. A super administrator can add it to your scope."),
        h("div", { class: "grid halves" }, healthPanel(app, [])));
      return;
    }

    const [assignments, events, audit, catalog] = await Promise.all([
      api("GET", `/api/admin/assignments?application_id=${encodeURIComponent(app.id)}`),
      api("GET", `/api/admin/integrations/${app.id}/events?limit=8`),
      api("GET", `/api/admin/audit?limit=8&application=${encodeURIComponent(app.slug)}`),
      api("GET", "/api/admin/roles"),
    ]);
    const roleInfo = catalog.roles.filter((r) => r.application_id === app.id);

    const kpis = h("div", { class: "kpis" },
      kpi("People with access", num(app.people), { sub: `${plural(app.roles.length, "role")} defined`, href: appHref(app.slug) + "/people" }),
      data.can_see_usage ? kpi(`Sessions, ${period}`, num(app.sessions_total), { delta: deltaChip(app.sessions_total, app.sessions_prev, period), sub: `${num(app.sessions_7d)} this week`, spark: sparkline(app.sessions_daily, color) }) : null,
      data.can_see_usage ? kpi("Sessions per person", app.people ? (app.sessions_total / app.people).toFixed(1) : "—", { sub: `Over ${period}` }) : null,
      kpi(`Access changes, ${period}`, num(app.granted + app.revoked), { sub: `${app.granted} granted · ${app.revoked} revoked` }),
      kpi("Reported failures, 7 days", num(app.failures_7d), { sub: app.last_access_ok_at ? `Last good check ${ago(app.last_access_ok_at)}` : "No access check yet", href: appHref(app.slug) + "/health" }));

    const roleParts = [
      ...app.roles.map((r, i) => ({ label: r.name, value: r.people, color: `var(--s${(i % 8) + 1})`, href: "#/role/" + r.id })),
      { label: "Standard access", value: app.standard_access, color: "var(--s-other)" },
    ];
    const rolesSplit = panel("Access by role", "Share of people in each role. Open a role for its holders and history.", app.people
      ? segmented(roleParts, { label: "Access by role" })
      : emptyState(icon("people"), "Nobody has access yet", "Grant access to an employee to get started."));

    const chartsRow = data.can_see_usage
      ? h("div", { class: "grid two-one" },
          panel("Sessions per day", `Last ${period}`, columnChart({ days: data.days, series: [{ name: "Sessions", color, values: app.sessions_daily }], label: `Sessions per day, ${app.name}` })),
          rolesSplit)
      : h("div", { class: "grid halves" }, rolesSplit, healthPanel(app, events));

    const filter = { q: "" };

    const visiblePeople = () => {
      const q = filter.q.trim().toLowerCase();
      return assignments.filter((a) => !q || a.email.toLowerCase().includes(q) || (a.role_name || "").toLowerCase().includes(q));
    };
    const paintPeople = () => {
      const shown = visiblePeople();
      peopleBody.replaceChildren(shown.length
        ? table([{ label: "Employee" }, { label: "Role" }, { label: "Granted" }, { label: "", sort: false }], shown.map((a) => [
            { node: personLink(a.user_id, a.email), sort: a.email },
            { node: a.role_name ? h("a", { href: "#/role/" + a.app_role_id, class: "badge accent badge-link" }, a.role_name) : badge("Standard access", "neutral"), sort: a.role_name || "" },
            whenCell(a.granted_at),
            { className: "actions-cell", node: h("span", { class: "actions" },
                button("Change role", () => changeRole(a), { small: true, ariaLabel: `Change ${a.email}'s role in ${a.application_name}` }),
                button("Revoke", () => revoke(a), { small: true, danger: true, ariaLabel: `Revoke ${a.application_name} from ${a.email}` })) },
          ]), { label: `People with access to ${app.name}`, sortable: true })
        : emptyState(icon("people"), assignments.length ? "No matches" : "Nobody has access yet", assignments.length ? "Change the search." : "Grant access to an employee to get started."));
    };
    paintPeople();
    const peoplePanel = panel("People with access", "Revoking takes effect at the next request.", h("div", null,
      assignments.length > 6 ? h("div", { class: "toolbar", style: "padding:0 18px" }, toolbarSearch("Search by email or role", "", (v) => { filter.q = v; paintPeople(); }, "Search people with access")) : null,
      peopleBody), {
      id: "section-people", flush: true,

        app.enabled ? button("Grant access", () => openGrant({ appId: app.id }), { small: true, primary: true }) : null],
    });

    const rolesPanel = panel("Roles", "What each role is for, and how recently it changed.", roleInfo.length
      ? table([{ label: "Role" }, { label: "Value in the application" }, { label: "Purpose" }, { label: "Last change" }], roleInfo.map((r) => [
          { node: roleLink(r.id, r.name), sort: r.name },
          { node: h("code", { class: "mono" }, r.external_role) },
          { node: h("span", { class: "muted" }, r.description || "—") },
          whenCell(r.last_change_at, "No changes"),
        ]), { label: `Roles of ${app.name}`, sortable: true })
      : emptyState(icon("shield"), "No roles yet", "Add the roles this application enforces, so assignments can use them."),
      { id: "section-roles", flush: true, actions: button("Manage roles", () => manageRoles(app), { small: true }) });

    const activityPanel = panel("Activity", "Latest audited changes for this application", feed(audit.items.map((e) => ({
      occurred_at: e.occurred_at, outcome: e.outcome, text: capitalize(actionText(e.action)),
    })), "No activity yet", "Changes to this application's access appear here."),
      { id: "section-activity", flush: true, actions: linkButton("Open in audit log", "#/audit/" + encodeURIComponent(app.slug), { small: true }) });

    const live = data.live && data.live[app.slug];
    const liveBlock = live && live.status === "ok"
      ? [sectionTitle("Live figures", `Read from ${app.name}'s own database ${ago(live.generated_at)}. Counts only.`),
         h("div", { class: "kpis" }, Object.entries(live).filter(([, v]) => typeof v === "number").map(([k, v]) =>
           kpi(capitalize(k.replace(/_/g, " ")).replace(/ 30d$/, ", 30 days"), num(v))))]
      : null;

    fill(root, head, description, kpis, chartsRow, liveBlock,
      h("div", { class: "grid" }, peoplePanel),
      h("div", { class: "grid halves" }, rolesPanel, data.can_see_usage ? healthPanel(app, events) : activityPanel),
      data.can_see_usage ? h("div", { class: "grid" }, activityPanel) : null);
  }

  function healthPanel(app, events) {
    const health = HEALTH[app.health] || HEALTH.not_connected;
    return panel("Health & events", "Access checks and failures the application reports", h("div", null,
      h("dl", { class: "facts", style: "padding:0 18px 12px" },

  /* ================= Administration: employees ================= */

  async function renderEmployees(root) {
    const isSuper = state.me.platform_role === "super_admin";

    const filter = { q: "", role: "", status: "" };
    const body = h("div", { class: "panel" });
    let shown = users;

    const paint = () => {
      const q = filter.q.trim().toLowerCase();
      shown = users.filter((u) =>
        (!q || u.email.toLowerCase().includes(q) || (u.display_name || "").toLowerCase().includes(q)) &&
        (!filter.role || u.platform_role === filter.role) &&
        (!filter.status || u.status === filter.status));
      if (shown.length === 0) {
        body.replaceChildren(emptyState(icon("people"), users.length ? "No employees match" : "No employees yet",
          users.length ? "Adjust the search or filters." : "Add an employee by email. They can sign in once they have an AFS account."));
        return;
      }
      const rows = shown.map((u) => [
        { node: h("div", null, personLink(u.id, u.display_name || u.email), h("span", { class: "sub" }, u.email)), sort: u.display_name || u.email },
        { node: u.linked ? badge("Linked", "ok") : badge("Waiting for first sign-in", "warn"), sort: String(u.linked) },
        { node: isSuper ? roleSelect(u) : badge(ROLE_LABEL[u.platform_role] || u.platform_role, "accent"), sort: u.platform_role },
        { node: u.status === "active" ? badge("Active", "ok") : badge("Disabled", "bad"), sort: u.status },

        { className: "actions-cell", node: h("span", null,
          button("Edit", () => editEmployee(u), { small: true, ariaLabel: `Edit ${u.email}` }),
          !u.linked && u.status === "active"
            ? button("Send invite", () => sendInvite(u), { small: true, ariaLabel: `Send invitation to ${u.email}` })
            : null,
          !u.linked && (isSuper || u.platform_role === "employee")
            ? button("Remove", () => removeEmployee(u), { small: true, danger: true, ariaLabel: `Remove ${u.email}` })

      body.replaceChildren(table(["Employee", "Identity", "Platform role", "Status", "Last sign-in", ""].map((label) => ({ label })), rows, { label: "Employees", sortable: true }));
    };

    const roleSelect = (u) => h("select", { "aria-label": `Platform role for ${u.email}`, onchange: async (e) => {
      try {
        await api("PATCH", `/api/admin/users/${u.id}`, { platform_role: e.target.value });
        toast(`Role updated for ${u.email}.`);
        await renderEmployeesAgain();
      } catch (err) { toast(err.message, true); e.target.value = u.platform_role; }
    } }, ["employee", "access_admin", "super_admin"].map((r) => h("option", { value: r, selected: r === u.platform_role }, ROLE_LABEL[r])));

    const renderEmployeesAgain = () => navigate();

    const addButton = h("button", { type: "button", class: "primary", onclick: () => addEmployee() }, "Add employee");
    const roleFilter = h("select", { "aria-label": "Filter by role", onchange: (e) => { filter.role = e.target.value; paint(); } },
      h("option", { value: "" }, "All roles"),
      ["super_admin", "access_admin", "employee"].map((r) => h("option", { value: r }, ROLE_LABEL[r])));
    const statusFilter = h("select", { "aria-label": "Filter by status", onchange: (e) => { filter.status = e.target.value; paint(); } },
      h("option", { value: "" }, "All statuses"),

  function addEmployee() {
    openForm({
      title: "Add employee",
      description: "Creates the account and emails the employee a link to set their password. Once it is set, they sign in and land on their dashboard.",
      submitLabel: "Add employee",
      fields: [
        { label: "Email", name: "email", type: "email", required: true, hint: "Must match the employee's AFS sign-in email." },
        { label: "Display name", name: "display_name", hint: "Optional. Shown in the console." },
      ],
      onSubmit: async (values) => {
        const created = await api("POST", "/api/admin/users", { email: values.email.trim(), display_name: values.display_name.trim() || null });
        inviteToast(created.invitation, "Employee added");
      },
      done: () => navigate(),
    });
  }

  async function editEmployee(user) {
    const canScope = state.me.platform_role === "super_admin" && user.platform_role === "access_admin";
    let scopeBoxes = [];
    let extra = null;
    if (canScope) {
      const [apps, managed] = await Promise.all([
        api("GET", "/api/admin/applications"),
        api("GET", `/api/admin/users/${user.id}/managed-applications`),
      ]);
      const mine = new Set(managed.map((a) => a.id));
      scopeBoxes = apps.map((a) => ({ id: a.id, checkbox: h("input", { type: "checkbox", name: "scope", value: a.id, checked: mine.has(a.id) }), label: a.name }));
      extra = h("fieldset", { class: "field", style: "border:0;padding:0;margin:0" },
        h("legend", { style: "font-size:13px;font-weight:600;margin-bottom:6px" }, "Applications this administrator manages"),
        h("span", { class: "hint", style: "margin-bottom:6px" }, "Access administrators can grant and revoke access only for the applications ticked here."),
        scopeBoxes.length
          ? scopeBoxes.map((b) => h("label", { class: "switch", style: "padding:4px 0" }, b.checkbox, h("span", null, b.label)))
          : h("p", { class: "muted" }, "No applications are registered yet."));
    }
    openForm({
      title: "Edit employee",
      description: user.email + (canScope ? " · Access administrator" : ""),
      submitLabel: "Save changes",
      fields: [{ label: "Display name", name: "display_name", value: user.display_name || "", max: 120, hint: "Leave empty to keep the current name, or to show the email address." }],
      extra,
      onSubmit: async (values, form) => {
        const name = values.display_name.trim();
        if (name !== (user.display_name || "")) await api("PATCH", `/api/admin/users/${user.id}`, { display_name: name || user.email });
        if (canScope) {
          const ids = [...form.querySelectorAll("input[name=scope]:checked")].map((box) => box.value);
          await api("PUT", `/api/admin/users/${user.id}/managed-applications`, { application_ids: ids });
        }
        toast("Employee updated.");
      },
      done: () => navigate(),
    });
  }

  // Tells the admin what happened to the invitation email; a failure is shown so they can fix it and press Send invite.
  function inviteToast(invitation, prefix) {
    const status = invitation && invitation.status;
    if (status === "sent") toast(`${prefix}. They have been emailed a link to set their password (valid for 3 days).`);
    else if (status === "has_password") toast(`${prefix}. They already have an AFS password, so they were sent a sign-in link.`);
    else toast(`${prefix}, but ${(invitation && invitation.detail) || "the invitation email was not sent."} Use Send invite to try again.`, true);
  }

  async function sendInvite(user) {
    try {
      inviteToast(await api("POST", `/api/admin/users/${user.id}/invite`), `Invitation to ${user.email}`);
    } catch (err) { toast(err.message, true); }
  }

  function removeEmployee(user) {
    confirmDialog({
      title: `Remove ${user.email}?`,
      text: "They have not signed in yet, so the account is deleted along with any access granted to it. You can add the email again afterwards. The audit log keeps a record.",
      action: "Remove employee",
      onConfirm: async () => {
        await api("DELETE", `/api/admin/users/${user.id}`);
        toast("Employee removed.");
      },
      done: () => navigate(),
    });
  }

  function toggleStatus(user) {
    const disabling = user.status === "active";
    confirmDialog({
      title: disabling ? `Disable ${user.email}?` : `Reactivate ${user.email}?`,
      text: disabling
        ? "They lose access to Command Center at their next request, and to applications at their next sign-in. They are emailed about the change."
        : "They can sign in again. Their existing assignments are restored.",
      action: disabling ? "Disable account" : "Reactivate account",
      danger: disabling,
      onConfirm: async () => {
        await api("PATCH", `/api/admin/users/${user.id}`, { status: disabling ? "disabled" : "active" });
        toast(disabling ? "Account disabled." : "Account reactivated.");
      },
      done: () => navigate(),
    });
  }

  /* ================= Administration: applications and roles ================= */

  async function renderApplications(root) {
    const isSuper = state.me.platform_role === "super_admin";
    const apps = await api("GET", "/api/admin/applications");
    const rows = apps.map((a) => [
      { node: h("div", null, h("a", { href: "#/app/" + encodeURIComponent(a.slug), class: "row-link" }, a.name), h("span", { class: "sub mono" }, a.slug)) },
      { node: a.enabled ? badge("Enabled", "ok") : badge("Disabled", "neutral") },
      { node: a.launch_url ? h("a", { href: a.launch_url, target: "_blank", rel: "noopener noreferrer", class: "mono" }, a.launch_url) : badge("No launch URL", "warn") },
      { node: a.integration_type === "none" ? "Not integrated" : "Single sign-on" },
      { className: "actions-cell", node: h("span", null,
        managesApp(a.id) ? button("Roles", () => manageRoles(a), { small: true, ariaLabel: `Roles for ${a.name}` }) : null,
        isSuper ? button("Edit", () => editApplication(a), { small: true, ariaLabel: `Edit ${a.name}` }) : null,
        isSuper ? button(a.enabled ? "Disable" : "Enable", () => toggleApplication(a), { small: true, danger: a.enabled, ariaLabel: `${a.enabled ? "Disable" : "Enable"} ${a.name}` }) : null) },
    ]);
    root.replaceChildren(
      pageHead("Applications", "Applications are enabled only once they have a verified launch URL.",
        isSuper ? h("button", { type: "button", class: "primary", onclick: () => registerApplication() }, "Register application") : null),
      h("div", { class: "panel" }, apps.length ? table(["Application", "Status", "Launch URL", "Integration", ""].map((label) => ({ label })), rows, { label: "Applications" })
        : emptyState(icon("box"), "No applications", "Register an application to start assigning access.")));
  }

  function registerApplication() {
    openForm({
      title: "Register application",
      description: "New applications stay disabled until they have a launch URL and are enabled.",
      submitLabel: "Register",
      fields: [
        { label: "Name", name: "name", required: true, max: 120 },
        { label: "Slug", name: "slug", required: true, pattern: "[a-z0-9][a-z0-9\\-]{1,40}", hint: "Lowercase letters, digits and hyphens. Used in integrations; cannot be changed later." },
        { label: "Description", name: "description", type: "textarea", max: 1000 },
        { label: "Launch URL", name: "launch_url", type: "url", hint: "Optional for now. Required before the application can be enabled." },
      ],
      onSubmit: async (values) => {
        await api("POST", "/api/admin/applications", {
          name: values.name.trim(), slug: values.slug.trim(), description: values.description.trim(), launch_url: values.launch_url.trim() || null,
        });
        toast("Application registered. It stays disabled until enabled.");
      },
      done: () => navigate(),
    });
  }

  function editApplication(app) {
    openForm({
      title: "Edit application",
      description: app.slug,
      submitLabel: "Save changes",
      fields: [
        { label: "Name", name: "name", value: app.name, required: true, max: 120 },
        { label: "Description", name: "description", type: "textarea", value: app.description || "", max: 1000 },
        { label: "Launch URL", name: "launch_url", type: "url", value: app.launch_url || "", hint: "Must be an https address in production." },
      ],
      onSubmit: async (values) => {
        const body = { name: values.name.trim(), description: values.description.trim(), launch_url: values.launch_url.trim() || null };
        await api("PATCH", `/api/admin/applications/${app.id}`, body);
        toast("Application updated.");
      },
      done: () => navigate(),
    });
  }

  function toggleApplication(app) {
    if (app.enabled) {
      confirmDialog({
        title: `Disable ${app.name}?`,
        text: "Employees see it as unavailable and cannot open it. Its existing assignments are kept.",
        action: "Disable",
        onConfirm: () => api("PATCH", `/api/admin/applications/${app.id}`, { enabled: false }),
        done: () => { toast("Application disabled."); navigate(); },
      });
      return;
    }
    api("PATCH", `/api/admin/applications/${app.id}`, { enabled: true })
      .then(() => { toast("Application enabled."); navigate(); })
      .catch((err) => toast(err.message, true));
  }

  async function manageRoles(app) {
    const canEdit = ADMIN_ROLES.includes(state.me.platform_role) && managesApp(app.id);
    const roles = await api("GET", `/api/admin/applications/${app.id}/roles`);
    const dialog = h("dialog", { class: "wide", "aria-labelledby": "roles-title" });
    const close = h("button", { type: "button", onclick: () => dialog.close() }, "Done");
    const list = roles.length
      ? table(["Central role", "Value in the application", "Description", ""].map((label) => ({ label })), roles.map((r) => [
          { node: h("code", { class: "mono" }, r.name) },
          { node: h("code", { class: "mono" }, r.external_role) },
          r.description || "—",
          { className: "actions-cell", node: button("Delete", () => confirmDialog({
              title: `Delete role ${r.name}?`,
              text: "Assignments that use this role must be changed first. Deletion is refused while any use it.",
              action: "Delete role",
              onConfirm: () => api("DELETE", `/api/admin/roles/${r.id}`),
              done: () => { dialog.close(); manageRoles(app); },
            }), { small: true, danger: true, ariaLabel: `Delete ${r.name}` }) },
        ]))
      : emptyState(icon("key"), "No roles yet", "Add the roles this application enforces, so assignments can use them.");
    dialog.append(h("div", { class: "dialog-head" }, h("h2", { id: "roles-title" }, `Roles: ${app.name}`),
      h("p", { style: "margin:6px 0 0;color:var(--muted);font-size:14px" }, "Map each central role to the value the application itself checks.")),
      h("div", { class: "dialog-body" }, list, canEdit ? addRoleForm(app, dialog) : null),
      h("div", { class: "dialog-foot" }, close));
    document.body.append(dialog);
    dialog.addEventListener("close", () => dialog.remove());
    dialog.showModal();
  }

  function addRoleForm(app, dialog) {
    const errorBox = h("div", { class: "notice bad", role: "alert", hidden: true });
    const name = h("input", { name: "name", required: true, pattern: "[a-z0-9][a-z0-9_\\-]{0,39}", placeholder: "viewer", "aria-label": "Central role name" });
    const external = h("input", { name: "external_role", required: true, placeholder: "Value the application checks", "aria-label": "Value in the application" });
    const description = h("input", { name: "description", placeholder: "Optional description", "aria-label": "Description" });
    return h("form", { class: "panel", style: "padding:14px", onsubmit: async (e) => {
      e.preventDefault();
      if (!e.target.reportValidity()) return;
      errorBox.hidden = true;
      try {
        await api("POST", `/api/admin/applications/${app.id}/roles`, { name: name.value.trim(), external_role: external.value.trim(), description: description.value.trim() });
        toast("Role added.");
        dialog.close();
        manageRoles(app);
      } catch (err) { errorBox.textContent = err.message; errorBox.hidden = false; }
    } },
      h("strong", { style: "display:block;margin-bottom:10px" }, "Add a role"),
      errorBox,
      h("div", { style: "display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))" }, name, external, description),
      h("div", { style: "margin-top:10px;text-align:right" }, h("button", { type: "submit", class: "primary small" }, "Add role")));
  }

  /* ================= Administration: assignments ================= */

  async function renderAssignments(root, presetApp) {
    const [assignments, apps, users] = await Promise.all([
      api("GET", "/api/admin/assignments"),
      api("GET", "/api/admin/applications"),
      api("GET", "/api/admin/users"),
    ]);
    const filter = { q: "", app: apps.some((a) => a.id === presetApp && managesApp(a.id)) ? presetApp : "" };
    const body = h("div", { class: "panel" });
    let shown = assignments;
    const paint = () => {
      const q = filter.q.trim().toLowerCase();
      shown = assignments.filter((a) =>
        (!q || a.email.toLowerCase().includes(q)) && (!filter.app || a.application_id === filter.app));
      if (shown.length === 0) {
        body.replaceChildren(emptyState(icon("key"), assignments.length ? "No matches" : "No access granted yet",
          assignments.length ? "Adjust the search or application filter." : "Grant an employee access to an application to get started."));
        return;
      }
      body.replaceChildren(table(["Employee", "Application", "Role", "Granted", ""].map((label) => ({ label })), shown.map((a) => [
        { node: personLink(a.user_id, a.email), sort: a.email },
        { node: appLink(a.application_slug, a.application_name), sort: a.application_name },
        { node: a.role_name ? h("a", { href: "#/role/" + a.app_role_id, class: "badge accent badge-link" }, a.role_name) : badge("Standard access", "neutral"), sort: a.role_name || "" },
        whenCell(a.granted_at),
        { className: "actions-cell", node: h("span", { class: "actions" },
            button("Change role", () => changeRole(a), { small: true, ariaLabel: `Change ${a.email}'s role in ${a.application_name}` }),
            button("Revoke", () => revoke(a), { small: true, danger: true, ariaLabel: `Revoke ${a.application_name} from ${a.email}` })) },
      ]), { label: "Assignments", sortable: true }));
    };
    const managedApps = apps.filter((a) => managesApp(a.id));
    const appFilter = h("select", { "aria-label": "Filter by application", onchange: (e) => { filter.app = e.target.value; paint(); } },
      h("option", { value: "" }, "All applications"), managedApps.map((a) => h("option", { value: a.id }, a.name)));
    appFilter.value = filter.app;
    root.replaceChildren(
      pageHead("Assignments", "Who can open which application, and with which role. Revoking takes effect at the next request.",
        h("button", { type: "button", class: "primary", onclick: () => grantAccess(users, apps) }, "Grant access")),
      h("div", { class: "toolbar" }, toolbarSearch("Search by employee email", "", (v) => { filter.q = v; paint(); }, "Search assignments"), appFilter,
        h("span", { style: "margin-left:auto" }, csvButton("assignments", () => ({
          headers: ["Email", "Application", "Role", "Granted"],
          rows: shown.map((a) => [a.email, a.application_name, a.role_name || "Standard access", a.granted_at]) })))),
      body);
    paint();
  }

  // `preset` can choose the employee, application and role in advance: { userId, appId, roleId }.
  function grantAccess(users, apps, preset = {}) {
    const active = users.filter((u) => u.status === "active");
    const enabled = apps.filter((a) => a.enabled && managesApp(a.id));
    if (!active.length || !enabled.length) {
      toast(!active.length ? "Add an active employee first." : "No enabled application is available for you to manage.", true);
      return;
    }
    const roleSelect = h("select", { name: "app_role_id", "aria-label": "Role" }, h("option", { value: "" }, "Standard access"));
    const loadRoles = async (appId) => {
      roleSelect.replaceChildren(h("option", { value: "" }, "Standard access"));
      const roles = await api("GET", `/api/admin/applications/${appId}/roles`);
      roleSelect.append(...roles.map((r) => h("option", { value: r.id }, `${r.name} (${r.external_role})`)));
    };
    const appSelect = h("select", { name: "application_id", "aria-label": "Application", onchange: (e) => loadRoles(e.target.value).catch((err) => toast(err.message, true)) },
      enabled.map((a) => h("option", { value: a.id }, a.name)));
    const dialog = openForm({
      title: "Grant access",
      description: "The employee can open the application at their next request. They are emailed about the change.",
      submitLabel: "Grant access",
      fields: [{ label: "Employee", name: "user_id", value: active.some((u) => u.id === preset.userId) ? preset.userId : "", options: [{ value: "", label: "Choose an employee…" }, ...active.map((u) => ({ value: u.id, label: u.email }))], required: true }],
      extra: [h("div", { class: "field" }, h("label", { for: "grant-app" }, "Application *"), (appSelect.id = "grant-app", appSelect)),
              h("div", { class: "field" }, h("label", { for: "grant-role" }, "Role"), (roleSelect.id = "grant-role", roleSelect))],
      onSubmit: async (values) => {
        await api("POST", "/api/admin/assignments", {
          user_id: values.user_id, application_id: appSelect.value, app_role_id: roleSelect.value || null,
        });
        toast("Access granted.");
      },
      done: () => navigate(),
    });
    if (enabled.some((a) => a.id === preset.appId)) appSelect.value = preset.appId;
    loadRoles(appSelect.value).then(() => { if (preset.roleId) roleSelect.value = preset.roleId; }).catch((err) => toast(err.message, true));
    return dialog;
  }

  // Changes the role in place. The employee keeps access throughout, so nothing is revoked and granted again.
  function changeRole(assignment) {
    const roleSelect = h("select", { name: "app_role_id", "aria-label": "Role" }, h("option", { value: "" }, "Standard access"));
    api("GET", `/api/admin/applications/${assignment.application_id}/roles`)
      .then((roles) => {
        roleSelect.append(...roles.map((r) => h("option", { value: r.id }, `${r.name} (${r.external_role})`)));
        roleSelect.value = assignment.app_role_id || "";
      })
      .catch((err) => toast(err.message, true));
    return openForm({
      title: `Change role in ${assignment.application_name}`,
      description: `${assignment.email} keeps access. The new role applies at their next sign-in, and they are emailed about the change.`,
      submitLabel: "Save role",
      fields: [],
      extra: [h("div", { class: "field" }, h("label", { for: "change-role" }, "Role"), (roleSelect.id = "change-role", roleSelect))],
      onSubmit: () => api("POST", "/api/admin/assignments", {
        user_id: assignment.user_id, application_id: assignment.application_id, app_role_id: roleSelect.value || null,
      }),
      done: () => { toast("Role changed."); navigate(); },
    });
  }

  function revoke(assignment) {
    confirmDialog({
      title: `Revoke ${assignment.application_name}?`,
      text: `${assignment.email} will lose access at their next request. They are emailed about the change.`,
      action: "Revoke access",
      onConfirm: () => api("DELETE", `/api/admin/assignments/${assignment.id}`),
      done: () => { toast("Access revoked."); navigate(); },
    });
  }

  /* ================= Administration: integrations ================= */

  const HEALTH = {
    ok: { tone: "ok", label: "Healthy" },
    error: { tone: "bad", label: "Failing" },
    not_connected: { tone: "neutral", label: "Not connected yet" },
  };

  async function renderIntegrations(root) {
    const apps = await api("GET", "/api/admin/integrations");
    const failing = apps.filter((a) => a.status === "error").length;
    const connected = apps.filter((a) => a.status === "ok").length;
    const kpis = h("div", { class: "kpis" },
      [["Applications", apps.length], ["Healthy", connected], ["Failing", failing]].map(([label, value]) =>
        h("div", { class: "panel kpi" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value))));
    const cards = apps.length === 0
      ? emptyState(icon("pulse"), "No applications", "Register an application to see its integration health.")
      : h("div", { class: "cards" }, apps.map((a) => {
          const health = HEALTH[a.status] || HEALTH.not_connected;
          return h("article", { class: "panel card" },
            h("div", { class: "app-head" }, h("div", { class: "app-icon", "aria-hidden": "true" }, a.name.charAt(0).toUpperCase()),
              h("div", null, h("h3", null, h("a", { href: appHref(a.slug) + "/health" }, a.name)), h("span", { class: "sub mono muted" }, a.slug))),
            h("div", null, badge(health.label, health.tone)),
            h("div", { class: "meta" },
              h("div", null, "Last successful check: ", h("b", null, ago(a.last_access_ok_at))),
              h("div", null, "Last error: ", a.last_error ? h("b", { class: "bad" }, a.last_error) : "None"),
              h("div", null, "Enabled: ", h("b", null, a.enabled ? "Yes" : "No"))),
            h("div", { class: "foot" }, button("View events", () => showEvents(a), { small: true, ariaLabel: `View events for ${a.name}` })));
        }));
    root.replaceChildren(
      pageHead("Integrations", "Each application's access checks and any failures it reports. A failing status means a failure was reported after the last successful check."),
      kpis, cards);
  }

  // Usage: how heavily each application is used. Only figures that appear nowhere else: daily averages, peaks, active
  // days, sessions per person, each application's share and the weekday pattern, plus live figures from applications
  // that report them. Counts only; no personal details.
  const WEEKDAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  async function renderUsage(root) {
    const data = await api("GET", `/api/admin/overview?days=${state.period}`);
    const apps = data.applications;
    const length = data.period_days;
    const period = `${length} days`;
    const total = data.totals.sessions_total;
    const daily = data.days.map((_, i) => sum(apps.map((a) => a.sessions_daily[i])));
    const busiest = daily.indexOf(Math.max(...daily));
    const idleDays = daily.filter((v) => v === 0).length;
    const rows = apps.map((a) => {
      const peak = a.sessions_daily.indexOf(Math.max(...a.sessions_daily));
      return {
        a, avg: a.sessions_total / length, peakValue: a.sessions_daily[peak] || 0, peakDay: data.days[peak],
        activeDays: a.sessions_daily.filter((v) => v > 0).length, perPerson: a.people ? a.sessions_total / a.people : null,
        share: total ? a.sessions_total / total : 0,
      };
    }).sort((x, y) => y.a.sessions_total - x.a.sessions_total);
    const top = rows[0];
    const weekday = WEEKDAYS.map(() => 0);
    data.days.forEach((d, i) => { weekday[(dayDate(d).getDay() + 6) % 7] += daily[i]; });

    const tableRows = rows.map((r) => [
      { node: appLink(r.a.slug, r.a.name), sort: r.a.name },
      { node: r.a.enabled ? badge("Enabled", "accent") : badge("Disabled", "neutral"), sort: String(r.a.enabled) },
      { className: "num", node: num(r.a.sessions_total), sort: r.a.sessions_total },
      { className: "num", node: r.avg.toFixed(1), sort: r.avg },
      { className: "num", node: r.peakValue ? `${num(r.peakValue)} · ${shortDay(r.peakDay)}` : "—", sort: r.peakValue },
      { className: "num", node: `${r.activeDays} of ${length}`, sort: r.activeDays },
      { className: "num", node: r.perPerson === null ? "—" : r.perPerson.toFixed(1), sort: r.perPerson === null ? "" : r.perPerson },
      { className: "num", node: pct(r.a.sessions_total, total), sort: r.share },
      { node: deltaChip(r.a.sessions_total, r.a.sessions_prev, period), sort: r.a.sessions_prev ? (r.a.sessions_total - r.a.sessions_prev) / r.a.sessions_prev : (r.a.sessions_total ? 1e9 : 0) },
    ]);

    const live = data.live.biocap;
    let liveBlock;
    if (live && live.status === "ok") {
      liveBlock = h("div", { class: "kpis" },
        [["Biocap users", live.users_total], ["Active users", live.users_active], ["Logged in, 30 days", live.users_logged_in_30d],
         ["Stories", live.stories_total], ["Published", live.stories_published], ["Pending review", live.stories_pending_review]].map(([label, value]) => kpi(label, num(value))));
    } else {
      liveBlock = h("p", { class: "notice" }, live && live.status === "not_configured"
        ? "Biocap's live figures are not connected yet. An administrator sets BIOCAP_DB_URI for the Command Center."
        : "Biocap's live figures are unavailable right now. They are retried automatically.");
    }

    fill(root,
      pageHead("Usage", "Sessions are counted each time Command Center grants an application access (sign-in, or a token renewal that asks again).", periodPicker()),
      h("div", { class: "kpis" },
        kpi(`Sessions, ${period}`, num(total), { delta: deltaChip(total, data.totals.sessions_prev, period), sub: "vs the previous period" }),
        kpi("Average per day", (total / length).toFixed(1), { spark: sparkline(daily) }),
        kpi("Busiest day", daily[busiest] ? num(daily[busiest]) : "—", { sub: daily[busiest] ? longDay(data.days[busiest]) : "No sessions yet" }),
        kpi("Most used", top && top.a.sessions_total ? top.a.name : "—", { sub: top && top.a.sessions_total ? `${pct(top.a.sessions_total, total)} of all sessions` : "" }),
        kpi("Days without sessions", num(idleDays), { unit: `of ${length}` })),
      h("div", { class: "grid halves" },
        panel("Share of sessions", "Each application's part of all sessions", total
          ? segmented(rows.filter((r) => r.a.sessions_total).map((r) => ({ label: r.a.name, value: r.a.sessions_total, color: appColor(r.a.color_index), href: appHref(r.a.slug) })), { label: "Share of sessions" })
          : emptyState(icon("chart"), "No sessions yet", "Sessions appear once applications check access.")),
        panel("Sessions by weekday", `All applications, last ${period}`, hbars(WEEKDAYS.map((d, i) => ({ label: d, value: weekday[i] })), { label: "Sessions by weekday", unit: "Sessions", keepOrder: true }))),
      sectionTitle("By application", null, csvButton("usage", () => ({
        headers: ["Application", "Enabled", "Sessions", "Average per day", "Peak sessions", "Peak day", "Active days", "Sessions per person", "Share", "Previous period"],
        rows: rows.map((r) => [r.a.name, r.a.enabled ? "yes" : "no", r.a.sessions_total, r.avg.toFixed(2), r.peakValue, r.peakValue ? r.peakDay : "", r.activeDays,
          r.perPerson === null ? "" : r.perPerson.toFixed(2), (r.share * 100).toFixed(1) + "%", r.a.sessions_prev]) }))),
      h("div", { class: "panel" }, table([{ label: "Application" }, { label: "Status" }, { label: "Sessions", className: "num" }, { label: "Per day", className: "num" },
        { label: "Peak day", className: "num" }, { label: "Active days", className: "num" }, { label: "Per person", className: "num" }, { label: "Share", className: "num" }, { label: "Change" }],
        tableRows, { label: "Application usage", sortable: true })),
      sectionTitle("Biocap, live", "Read from Biocap's own database. Counts only."),
      liveBlock);
  }

  async function showEvents(app) {
    const events = await api("GET", `/api/admin/integrations/${app.id}/events?limit=100`);
    const dialog = h("dialog", { class: "wide", "aria-labelledby": "events-title" });
    dialog.append(
      h("div", { class: "dialog-head" }, h("h2", { id: "events-title" }, `Events: ${app.name}`)),
      h("div", { class: "dialog-body", style: "padding:0;max-height:70vh" }, events.length
        ? table(["When", "Kind", "Outcome", "Detail"].map((label) => ({ label })), events.map((e) => [
            { node: h("span", { title: fullDate(e.occurred_at) }, ago(e.occurred_at)) },
            { node: h("span", { class: "mono" }, e.kind) },
            { node: e.outcome === "success" ? badge("Success", "ok") : badge("Failure", "bad") },
            e.detail || "—",
          ]))
        : h("div", { style: "padding:16px" }, emptyState(icon("pulse"), "No events yet", "Events appear when the application checks access or reports a problem."))),
      h("div", { class: "dialog-foot" }, h("button", { type: "button", onclick: () => dialog.close() }, "Close")));
    document.body.append(dialog);
    dialog.addEventListener("close", () => dialog.remove());
    dialog.showModal();
  }

  /* ================= Administration: audit log ================= */

  async function renderAudit(root, presetSlug) {
    const apps = await api("GET", "/api/admin/applications");
    const PAGE = 50;
    const query = { action: "", outcome: "", application: apps.some((a) => a.slug === presetSlug) ? presetSlug : "", offset: 0 };
    const body = h("div", { class: "panel" });
    const pager = h("div", { class: "pager" });

    let lastItems = [];
    const load = async () => {
      body.replaceChildren(skeleton());
      const params = new URLSearchParams({ limit: PAGE, offset: query.offset });
      if (query.action) params.set("action", query.action);
      if (query.outcome) params.set("outcome", query.outcome);
      if (query.application) params.set("application", query.application);
      try {
        const page = await api("GET", "/api/admin/audit?" + params.toString());
        lastItems = page.items;
        if (page.items.length === 0) {
          body.replaceChildren(emptyState(icon("log"), "No matching entries", "Change the filters to see more activity."));
        } else {
          body.replaceChildren(table(["When", "Who", "Action", "Target", "Application", "Outcome", ""].map((label) => ({ label })), page.items.map((e) => {
            const details = h("pre", { class: "details", hidden: true }, JSON.stringify(e.details || {}, null, 2));
            const toggle = h("button", { type: "button", class: "small", "aria-expanded": "false", onclick: () => {
              details.hidden = !details.hidden;
              toggle.setAttribute("aria-expanded", String(!details.hidden));
            } }, "Details");
            return [
              { node: h("span", { title: fullDate(e.occurred_at) }, ago(e.occurred_at)) },
              { node: e.actor_user_id ? personLink(e.actor_user_id, e.actor_name || (e.actor_identity || "").slice(0, 12)) : h("span", { class: "muted" }, e.actor_identity === "anonymous" ? "Anonymous" : "System") },
              { node: h("span", { class: "mono" }, e.action) },
              { node: `${e.target_type}${e.target_id ? " " + String(e.target_id).slice(0, 8) : ""}` },
              e.application_slug || "—",
              { node: e.outcome === "success" ? badge("Success", "ok") : badge("Failure", "bad") },
              { className: "actions-cell", node: h("div", null, toggle, details) },
            ];
          }), { label: "Audit entries" }));
        }
        const from = query.offset + 1;
        const to = Math.min(query.offset + PAGE, page.total);
        pager.replaceChildren(
          h("span", null, page.total ? `Showing ${from}–${to} of ${page.total}` : "No entries"),
          h("span", { class: "actions" },
            button("Previous", () => { query.offset = Math.max(0, query.offset - PAGE); load(); }, { small: true, disabled: query.offset === 0 }),
            button("Next", () => { query.offset += PAGE; load(); }, { small: true, disabled: query.offset + PAGE >= page.total })));
      } catch (err) {
        body.replaceChildren(errorNotice(err, load));
      }
    };

    const actionInput = h("input", { type: "search", placeholder: "Action, e.g. assignment", "aria-label": "Filter by action", onchange: (e) => { query.action = e.target.value.trim(); query.offset = 0; load(); } });
    const outcomeSelect = h("select", { "aria-label": "Filter by outcome", onchange: (e) => { query.outcome = e.target.value; query.offset = 0; load(); } },
      h("option", { value: "" }, "Any outcome"), h("option", { value: "success" }, "Success"), h("option", { value: "failure" }, "Failure"));
    const appSelect = h("select", { "aria-label": "Filter by application", onchange: (e) => { query.application = e.target.value; query.offset = 0; load(); } },
      h("option", { value: "" }, "All applications"), apps.map((a) => h("option", { value: a.slug }, a.name)));
    appSelect.value = query.application;

    root.replaceChildren(
      pageHead("Audit log", "Every privileged change, sign-in and refused action, with who did it and when. Entries cannot be edited or deleted."),
      h("div", { class: "toolbar" }, actionInput, outcomeSelect, appSelect,
        h("span", { style: "margin-left:auto" }, csvButton("audit-log", () => ({
          headers: ["When", "Who", "Identity", "Action", "Target type", "Target", "Application", "Outcome", "Details"],
          rows: lastItems.map((e) => [e.occurred_at, e.actor_name || "", e.actor_identity, e.action, e.target_type, e.target_id || "", e.application_slug || "", e.outcome, JSON.stringify(e.details || {})]),
        }), "Export this page"))),
      body, pager);
    load();
  }

  /* ================= sign-in and start-up ================= */

  async function start() {
    applyTheme(readPref("afs.theme", "system"));
    const params = new URLSearchParams(location.search);
    const ssoError = params.get("sso_error");
    try {
      const me = await api("GET", "/api/me");
      showSignedIn(me);
      if (!location.hash) location.hash = "#/home";
      window.addEventListener("hashchange", navigate);
      await navigate();
    } catch (_) {
      showSignedOut(ssoError ? "Sign-in did not complete. Please try again." : "");
    }
  }

  start();
</script>
</body>
</html>
