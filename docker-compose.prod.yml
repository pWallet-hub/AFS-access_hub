# Production overlay. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requirements: TLS terminates at a reverse proxy in front of the frontend and Keycloak; PUBLIC_BASE_URL and
# KEYCLOAK_PUBLIC_URL are https addresses; ENVIRONMENT=production so the backend refuses unsafe settings at startup.
services:
  keycloak:
    build: ./keycloak
    command: ["start", "--optimized"]
    environment:
      KC_HTTP_ENABLED: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "true"
    ports: !reset []
    restart: unless-stopped

  backend:
    environment:
      ENVIRONMENT: production
      SESSION_HTTPS_ONLY: "true"
    restart: unless-stopped

  frontend:
    restart: unless-stopped
